<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>共享格式与算子策略分层</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #f8fafc; font-family: -apple-system, "PingFang SC", sans-serif; }
  #chart { width: 1200px; height: 720px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
const option = {
  backgroundColor: '#f8fafc',
  title: {text: '共享格式与算子策略分层', subtext: '单一 DType 事实源 · 文件产出 · 投影策略 · 无循环依赖', left: 'center', top: 24, textStyle: {color: '#0f172a', fontSize: 26}, subtextStyle: {color: '#64748b', fontSize: 15}},
  tooltip: {show: false},
  series: [{
    type: 'graph', layout: 'none', symbol: 'roundRect', symbolSize: [220, 82], roam: false,
    label: {show: true, color: '#ffffff', fontSize: 17, lineHeight: 24, fontWeight: 600},
    edgeSymbol: ['none', 'arrow'], edgeSymbolSize: [0, 14],
    edgeLabel: {show: true, fontSize: 14, color: '#475569', backgroundColor: '#f8fafc', padding: [3, 5]},
    lineStyle: {color: '#94a3b8', width: 3, curveness: 0},
    data: [
      {name: 'dtype\n共享格式事实', x: 160, y: 310, itemStyle: {color: '#2563eb'}, label: {fontSize: 19}},
      {name: 'weights\n文件与量化配对', x: 510, y: 150, itemStyle: {color: '#059669'}},
      {name: 'nn\n投影算子策略', x: 510, y: 470, itemStyle: {color: '#d97706'}},
      {name: 'serve\n形状与执行装配', x: 865, y: 310, itemStyle: {color: '#7c3aed'}}
    ],
    links: [
      {source: 'dtype\n共享格式事实', target: 'weights\n文件与量化配对', label: {show: true, formatter: '复用 DType + group'}, lineStyle: {curveness: 0.12}},
      {source: 'dtype\n共享格式事实', target: 'nn\n投影算子策略', label: {show: true, formatter: '同一 WeightFormat'}, lineStyle: {curveness: -0.12}},
      {source: 'weights\n文件与量化配对', target: 'nn\n投影算子策略', label: {show: true, formatter: 'weight_format()'}, lineStyle: {curveness: 0.18}},
      {source: 'nn\n投影算子策略', target: 'serve\n形状与执行装配', label: {show: true, formatter: 'operator_for()'}},
      {source: 'weights\n文件与量化配对', target: 'serve\n形状与执行装配', label: {show: true, formatter: 'Entry / Scale'}, lineStyle: {curveness: -0.16}}
    ]
  }]
};
chart.setOption(option);
</script>
</body>
</html>
