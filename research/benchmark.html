<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WeightFormat release 微基准</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #f8fafc; font-family: -apple-system, "PingFang SC", sans-serif; }
  #chart { width: 1200px; height: 720px; margin: 0 auto; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
const option = {
  backgroundColor: '#f8fafc',
  color: ['#94a3b8', '#2563eb'],
  title: {text: 'WeightFormat release 微基准（越低越好）', subtext: '同机 · 每轮 1800 万次调用 · 各 5 轮取中值 · 单位 ms', left: 'center', top: 24, textStyle: {color: '#0f172a', fontSize: 25}, subtextStyle: {color: '#64748b', fontSize: 15}},
  legend: {top: 100, textStyle: {fontSize: 15, color: '#334155'}},
  tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'}, valueFormatter: value => Number(value).toFixed(3) + ' ms'},
  grid: {left: 110, right: 60, top: 165, bottom: 95},
  xAxis: {type: 'category', data: ['dtype()', 'operator_for()'], axisLabel: {fontSize: 17, color: '#334155'}, axisLine: {lineStyle: {color: '#94a3b8'}}},
  yAxis: {type: 'value', name: '耗时（ms）', nameTextStyle: {fontSize: 15, color: '#475569'}, axisLabel: {fontSize: 14, color: '#475569'}, splitLine: {lineStyle: {color: '#e2e8f0'}}},
  series: [
    {name: '原始枚举实现', type: 'bar', barWidth: 70, data: [9.175834, 137.791791], label: {show: true, position: 'top', formatter: p => Number(p.value).toFixed(3), fontSize: 16, color: '#475569'}, itemStyle: {borderRadius: [5, 5, 0, 0]}},
    {name: 'DType 组合拆分', type: 'bar', barWidth: 70, data: [5.133459, 124.43725], label: {show: true, position: 'top', formatter: p => Number(p.value).toFixed(3), fontSize: 16, color: '#1d4ed8', fontWeight: 600}, itemStyle: {borderRadius: [5, 5, 0, 0]}}
  ]
};
chart.setOption(option);
</script>
</body>
</html>
