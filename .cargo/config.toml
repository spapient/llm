[term]
color = "auto"
verbose = false

[build]

#统一并发构建的行为；不固定 jobs，让 Cargo 根据环境自动调度。

incremental = true

[future-incompat-report]
frequency = "always"

# --- Vendored offline sources (S5 slimmed 2026-10-18) ------------------------
# 2026-10-18 重建为当前闭包：`cargo vendor vendor/ --versioned-dirs --locked`
# 从 Cargo.lock 全量解析（155 crates，含 regex 1.13.1 / unicode-normalization
# 0.1.25 / tinyvec / blake3 / crc32c 等），移除 37 个已清除依赖（archmage、
# clap、tracing、thiserror、zstd 等），供 Claude Code 会话沙箱
# （strictAllowlist 锁死 crates.io）离线解析新依赖。
# 使用方式：agent 在 Cargo.toml 声明依赖（如 unicode-normalization = "0.1"）
# 后执行 `cargo build --offline`，无需网络。
# 注意：新增 vendor 闭包之外的 crates.io 依赖时必须先补 vendor 目录
# （重新跑 cargo vendor 或找 MainAgent 代拉），否则会报「无法解析」。
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor/"
