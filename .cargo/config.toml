[term]
color = "auto"
verbose = false

[build]

#统一并发构建的行为；不固定 jobs，让 Cargo 根据环境自动调度。

incremental = true

[future-incompat-report]
frequency = "always"

# --- Vendored offline sources (added 2026-10-15) -----------------------------
# 沙箱网络锁死 rsproxy.cn 时无需联网；依赖已由 `cargo vendor` 拉取到 vendor/。
# Rollback: 删除以下两段即可恢复联网解析（rsproxy.cn 镜像）。
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
