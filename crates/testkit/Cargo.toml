[package]
name = "llm-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Test fixtures shared across the workspace: float comparison, device gating, scratch dirs, and workspace-level contract gates."
publish = false
# 测试文件住在 `tests/`，由 `src/` 里的 `#[cfg(test)] #[path = "../tests/…"] mod …` 钩子挂载
# 成单元测试（`super`/`crate` 仍指向本 crate）；`autotests = false` 关闭 `tests/` 的自动集成测试。
autotests = false

[dependencies]

# 性质测试装置（`prop`）：配置、受约束生成器、精确相等断言。proptest 本身是测试库，而 testkit
# 只作各成员的 dev-dependency，所以这条依赖进不了任何二进制——夹具「不拉被测 crate」的约束仍在。
proptest = { workspace = true }

# 只服务 `src/` 里的跨层对拍与工作区契约门禁；不进夹具库运行时。
[dev-dependencies]
serde_json = "1.0.154"
autograd = { path = "../autograd", package = "llm-autograd" }
cutile = { path = "../cutile" }
nn = { path = "../nn", package = "llm-nn" }
op = { path = "../op", package = "llm-op" }
tensor = { path = "../tensor", package = "llm-tensor" }
tool = { path = "../tools", package = "llm-tools" }
train = { path = "../train", package = "llm-train" }
weights = { path = "../weights", package = "llm-weights" }

[lints]
workspace = true
