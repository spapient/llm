[package]
name = "llm-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Test fixtures shared across the workspace: float comparison, device gating, scratch dirs, and workspace-level contract gates."
publish = false
# 全部测试都躺在 `src/` 里（各文件的 `#[cfg(test)] mod tests`），没有 `tests/` 目录。
autotests = false

[dependencies]

# 只服务 `src/` 里的跨层对拍与工作区契约门禁；不进夹具库运行时。
[dev-dependencies]
serde_json = "1.0.154"
autograd = { path = "../autograd", package = "llm-autograd" }
cutile = { path = "../cutile" }
nn = { path = "../nn", package = "llm-nn" }
op = { path = "../op", package = "llm-op" }
tensor = { path = "../tensor", package = "llm-tensor" }
tool = { path = "../tools", package = "llm-tools" }
train = { path = "../train", package = "llm-train" }
weights = { path = "../weights", package = "llm-weights" }

[lints]
workspace = true
