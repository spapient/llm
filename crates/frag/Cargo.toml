[package]
name = "llm-frag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Device fragments: the six vendors' primitive implementations and witnesses, one module per device."
publish = false
build = "build.rs"

[dependencies]
prof = { path = "../prof", package = "llm-prof" }

# 构建脚本用本层的 codegen：读同一份档案（输出语言、工具链、每条签名的见证入口），生成即校验。
[build-dependencies]
prof = { path = "../prof", package = "llm-prof", features = ["build"] }

[features]
default = []
# 构建期把能编的见证编成设备镜像并嵌入二进制；没有镜像配方时只是 `Status::NoRecipe`。
device-image = []

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true
