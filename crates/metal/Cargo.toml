[package]
name = "metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Apple Metal GPU execution backend for the LLM runtime (macOS only)"

[lib]
name = "metal"

[dependencies]
thiserror.workspace = true
lib = { path = "../lib" }
tensor = { path = "../tensor" }
api = { path = "../api" }

# Platform bindings are only pulled in on macOS. Every other target compiles
# this crate as an empty library so that `cargo check --workspace --all-targets`
# stays green on any host (see docs/design.md 第 21 章).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-metal = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }

[lints]
workspace = true
