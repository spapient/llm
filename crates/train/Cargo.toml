[package]
name = "llm-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Training loop state: borrowed token batches, learning-rate schedule, step records, resumable checkpoints and their byte format."
publish = false
autotests = false

[dependencies]
autograd = { path = "../autograd", package = "llm-autograd" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
nn = { path = "../nn", package = "llm-nn" }
op = { path = "../op", package = "llm-op" }
shard = { path = "../shard", package = "llm-shard" }
tensor = { path = "../tensor", package = "llm-tensor" }
weights = { path = "../weights", package = "llm-weights" }
snapshot = { path = "../snapshot", package = "llm-snapshot" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true
