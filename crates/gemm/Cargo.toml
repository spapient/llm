[package]
name = "llm-gemm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dense compute kernels: matmul/gemm/gemv families, activation, normalization and quantization."
readme = "README.md"
publish = false
autotests = false

[dependencies]
annotation = { path = "../annotation", package = "llm-annotation" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
half = { workspace = true, features = ["num-traits"] }
llm-spec = { path = "../spec" }
num-traits = { workspace = true }
prof = { path = "../prof", package = "llm-prof" }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
testkit = { path = "../testkit", package = "llm-testkit" }
