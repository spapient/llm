[package]
name = "llm-op"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Declaration layer: per-operator declarations, templates, their parsing and operator semantics."
readme = "README.md"
publish = false

[dependencies]
annotation = { path = "../annotation", package = "llm-annotation" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
prof = { path = "../prof", package = "llm-prof" }

[lints]
workspace = true

[build-dependencies]
# 构建期共享内核（扫描/读取/生成）在 diagnostic 的 build feature 下，运行期不引入 toml。
diagnostic = { path = "../diagnostic", package = "llm-diagnostic", features = ["build"] }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }
