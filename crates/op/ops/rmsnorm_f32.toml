# RMSNorm：y[n] = gamma[n] * x[n] / sqrt(mean(x^2)+1e-6)。
# OpDecl 闭集没有专用骨架，归到 elementwise（两趟逐元素遍历）；needs 只有 load/store。

[op]
name     = "rmsnorm_f32"
skeleton = "elementwise"
summary  = "y[n] = gamma[n] * x[n] / rms(x)"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
x     = "row"
gamma = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
