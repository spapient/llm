# 求和归约：y[0] = sum(a[0..n])。
# reduce 骨架：输入轴 n 被规约，输出单元素；needs 为 reduce/store。

[op]
name     = "reduce_sum_f32"
skeleton = "reduce"
summary  = "y[0] = sum(a[0..n])"

[axes]
N = [32]

[needs]
reduce = { axis = ["GMAX"], op = ["sum"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
