# 大 K 稠密矩阵乘：Y[m,n] = sum_k A[m,k]*B[k,n]，收缩轴 K=4096（prefill 主链路代表值）。
# OpDecl skeleton="gemm"；CPU 无 MMA 片段，标量三重循环，needs 只有 load/store。

[op]
name     = "matmul_f32"
skeleton = "gemm"
summary  = "Y[m,n] = sum_k A[m,k] B[k,n] (K=4096)"

[axes]
N = [256]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"
b = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
