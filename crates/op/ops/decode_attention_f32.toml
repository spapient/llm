# decode 朴素注意力：单条 query（典型 q_rows=1）对历史 K/V 做 softmax 加权。
# OpDecl 闭集没有专用骨架，归到 elementwise；needs 只有 load/store（数学走标量函数）。

[op]
name     = "decode_attention_f32"
skeleton = "elementwise"
summary  = "O = softmax(QK^T/sqrt(d)) V over cached history"

[axes]
N = [8]

[needs]
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
reduce = { axis = ["GMAX"], op = ["max"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
q = "row"
k = "row"
v = "row"
y = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
