# weight-only int2 解码 GEMV：与 gemv_i4 同构，只差 quant 码型与打包宽度。
base = "gemv_i4"

[op]
name     = "gemv_i2"
skeleton = "gemm"
summary  = "y[n] = Σ_g scale[n,g] · dot(dequant(w[n, g·G : g·G+G]), x[g·G : g·G+G])"

# 唯一的结构差异：码型 i4→i2；space/group 与 gemv_i4 相同，由 base 继承。
[needs.quant]
dt = ["i2", "f32"]

# 打包宽度（i2=每字节 4 码、每码 2 位、零点 2）。
[consts]
cpb   = 4
width = 2
zero  = 2
