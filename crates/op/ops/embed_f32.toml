# Embedding 查表：y[n] = table[idx[n]]。
# OpDecl 闭集归到 elementwise（gather 遍历）；needs 只有 load/store，表长是标量参数。

[op]
name     = "embed_f32"
skeleton = "elementwise"
summary  = "y[n] = table[idx[n]]"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
idx   = "row"
table = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
