# 标量缩放：y[n] = alpha*x[n]。
# OpDecl 闭集归到 elementwise；needs 只有 load/store，alpha 写成常量。

[op]
name     = "scale_f32"
skeleton = "elementwise"
summary  = "y[n] = alpha*x[n]"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
