# layer_norm_f32：y = gamma*(x-μ_row)/sqrt(σ²_row+eps)+beta。
# 归到 elementwise 骨架（声明档几何固定，真窗口/真统计走标量参考），算术在模板里展开。
base = "rmsnorm_f32"

[op]
name     = "layer_norm_f32"
skeleton = "elementwise"
summary  = "y = gamma*(x-μ_row)/sqrt(σ²_row+eps)+beta"

[layouts]
x     = "row"
gamma = "row"
beta  = "row"
y     = "row"
