# 对称 int8 解码 GEMV：不打包、零点 0，每 GROUP 个元素一条标度。
# int8 有符号解释是普通标量转换（内联在 .k），不占 quant 原语；其余原语与 gemv_i4 同档。

[op]
name     = "gemv_i8"
skeleton = "gemm"
summary  = "y[n] = Σ_g scale[n,g] · dot(signed(w[n,g]), x[g])"

[axes]
GMAX = [32]

[needs]
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
load   = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt    = { dt = ["f32", "i32"], sat = ["off"] }
reduce = { axis = ["GMAX"], op = ["sum"], dt = ["f32"] }
load_async  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM", "FAST"] }
commit_wait = {}
bar         = {}

[layouts]
w = "row"
x = "row"

# 网格映射：Gemm 骨架按输出行拆线程（一维网格）。`n:N` 表示把模板里的循环
# `for (int n = 0; n < N; ++n)` 绑定到线程下标（每线程一行）。
[grid]
dims = ["n:N"]

[[variants]]
name      = "pipe2"
order     = 1
schedule  = "pipe<2>"
mma_share = 0.62

[[variants]]
name      = "direct"
order     = 2
schedule  = "direct"
mma_share = 0.35
