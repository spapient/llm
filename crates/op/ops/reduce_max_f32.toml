# 最大值归约：y[0] = max(a[0..n])。
# reduce 骨架：与 reduce_sum 同构，只改折叠运算；needs 为 reduce/store。

[op]
name     = "reduce_max_f32"
skeleton = "reduce"
summary  = "y[0] = max(a[0..n])"

[axes]
N = [32]

[needs]
reduce = { axis = ["GMAX"], op = ["max"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
