# 缩放点积注意力：O = softmax(QK^T/sqrt(d)) V，朴素三阶段。
# OpDecl 闭集没有专用骨架，归到 elementwise；needs 只有 load/store（数学走标量函数）。

[op]
name     = "attention_f32"
skeleton = "elementwise"
summary  = "O = softmax(QK^T/sqrt(d)) V"

[axes]
N = [8]

[needs]
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
reduce = { axis = ["GMAX"], op = ["max"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
q = "row"
k = "row"
v = "row"
y = "row"

# 网格映射：按查询行拆线程（一维网格）。`i:S` 把模板里的循环
# `for (int i = 0; i < S; ++i)` 绑定到线程下标（每线程一行）；行内分数/软归一化留在每线程串行。
[grid]
dims = ["i:S"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
