[package]
name = "llm-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CPU device fragments: the `cpu` primitive implementations and their witness."
publish = false
autotests = false
build = "build.rs"

[dependencies]
prof = { path = "../prof", package = "llm-prof" }

# 构建脚本读同一份档案（输出语言、工具链、每条签名的见证入口），生成即校验。
[build-dependencies]
prof = { path = "../prof", package = "llm-prof" }

[features]
default = []
# 构建期把见证编成设备镜像并嵌入二进制；CPU 还没有镜像配方，开着只是 `Status::NoRecipe`。
device-image = []

[lints]
workspace = true
