[package]
name = "llm-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Serving state machine: sequences, their KV pages, the admission scheduler and the submission contract."
publish = false
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
tensor = { path = "../tensor", package = "llm-tensor" }
storage = { path = "../storage", package = "llm-storage" }
cutile = { path = "../cutile", package = "cutile" }
op = { path = "../op", package = "llm-op" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[[test]]
name = "schedule"
path = "tests/schedule.rs"
