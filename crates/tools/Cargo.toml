[package]
name = "llm-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Repository tool: config-driven static quality gates and human-readable output."
publish = false
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[build-dependencies]
# 构建期共享内核（读取/生成）在 diagnostic 的 build feature 下，运行期不引入 toml。
diagnostic = { path = "../diagnostic", package = "llm-diagnostic", features = ["build"] }
# 生成器按原生 TOML 表/值取字段，类型在 build script 内可见。
toml = { workspace = true }

[[test]]
name = "gate"
path = "tests/gate.rs"

[[test]]
name = "card"
path = "tests/card.rs"

[[test]]
name = "lex"
path = "tests/lex.rs"

[[test]]
name = "words"
path = "tests/words.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"
