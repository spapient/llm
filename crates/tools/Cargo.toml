[package]
name = "llm-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Repository tool: config-driven static quality gates and human-readable output."
publish = false
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[build-dependencies]
# 构建期共享内核（读取/生成）在 diagnostic 的 build feature 下，运行期不引入 toml。
diagnostic = { path = "../diagnostic", package = "llm-diagnostic", features = ["build"] }

[[test]]
name = "gate"
path = "tests/gate.rs"

[[test]]
name = "card"
path = "tests/card.rs"

[[test]]
name = "lex"
path = "tests/lex.rs"

[[test]]
name = "scan_tmp"
path = "tests/scan_tmp.rs"
