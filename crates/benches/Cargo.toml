[package]
name = "llm-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Measurement container: centralised criterion micro-benchmarks across the workspace."
publish = false

# 测量容器只在 bench target 里用这些依赖：criterion 负责统计（预热、采样、测量时长
# 都是它自己的配置），prof/op 是被测对象。
[dev-dependencies]
criterion = { workspace = true }
cutile = { path = "../cutile" }
prof = { path = "../prof", package = "llm-prof" }
op = { path = "../op", package = "llm-op" }
wire = { path = "../wire", package = "llm-wire" }
weights = { path = "../weights", package = "llm-weights" }
tokenizer = { path = "../tokenizer", package = "llm-tokenizer" }
train = { path = "../train", package = "llm-train" }
autograd = { path = "../autograd", package = "llm-autograd" }
tensor = { path = "../tensor", package = "llm-tensor" }
# 基线判定与报告归档：`tests/regress.rs` 用 `tool::regress` 判、用 `weights::json` 读
# criterion 的 estimates.json（本成员没有生产依赖，全部在 dev）。
tool = { path = "../tool", package = "llm-tool" }
testkit = { path = "../testkit", package = "llm-testkit" }

# 显式关闭 libtest harness：criterion 提供自己的 main（criterion_main!）。
# path 指向 criterion/ 子目录，未来可并列加 iai 等其他测量 harness。
[[bench]]
name = "elementwise"
path = "criterion/elementwise.rs"
harness = false

[[bench]]
name = "span_parse"
path = "criterion/span_parse.rs"
harness = false

[[bench]]
name = "negotiate"
path = "criterion/negotiate.rs"
harness = false

[[bench]]
name = "wire_codec"
path = "criterion/wire_codec.rs"
harness = false

[[bench]]
name = "gemv_f32"
path = "criterion/gemv_f32.rs"
harness = false

[[bench]]
name = "softmax_f32"
path = "criterion/softmax_f32.rs"
harness = false

[[bench]]
name = "rope_f32"
path = "criterion/rope_f32.rs"
harness = false

[[bench]]
name = "rmsnorm_f32"
path = "criterion/rmsnorm_f32.rs"
harness = false

[[bench]]
name = "attention_f32"
path = "criterion/attention_f32.rs"
harness = false

[[bench]]
name = "gemm_f32"
path = "criterion/gemm_f32.rs"
harness = false

[[bench]]
name = "weights_container"
path = "criterion/weights_container.rs"
harness = false

[[bench]]
name = "tokenizer"
path = "criterion/tokenizer.rs"
harness = false

[[bench]]
name = "train"
path = "criterion/train.rs"
harness = false

[lints]
workspace = true
