[package]
name = "llm-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Measurement container: centralised criterion micro-benchmarks across the workspace."
publish = false

# 测量容器只在 bench/test target 里用这些依赖：criterion 负责统计，prof/op 是被测对象，
# tool 的 regress 模块负责把实测值对照基线判定。
[dev-dependencies]
criterion = { workspace = true }
prof = { path = "../prof", package = "llm-prof" }
op = { path = "../op", package = "llm-op" }
tool = { path = "../tool", package = "llm-tool" }

# 显式关闭 libtest harness：criterion 提供自己的 main（criterion_main!）。
# path 指向 criterion/ 子目录，未来可并列加 iai 等其他测量 harness。
[[bench]]
name = "span_parse"
path = "criterion/span_parse.rs"
harness = false

[lints]
workspace = true
