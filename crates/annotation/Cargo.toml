[package]
name = "llm-annotation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Attribute macros for checked contracts and typed kernel DSLs."
publish = false
autotests = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# 仅在编译期宏进程内解析算子语料 TOML，不链接进消费方运行期二进制（见 ADR 0022 补记）。
toml = { workspace = true }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[[test]]
name = "audit"
path = "tests/audit.rs"
