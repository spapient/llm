[package]
name = "llm-weights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Weight files: entries, header validation, plus safetensors archives (whole-buffer or header-only file backend)."
publish = false
# 本 crate 没有可执行目标，禁用 bin 自动发现。
autobins = false
autotests = false

[features]
default = []
# 只读内存映射源：复用 `storage` 的唯一 unsafe 岛；仅 Unix 目标有实现，其它平台该模块不编译。
mmap = ["storage/mmap"]

[dependencies]
dtype = { path = "../dtype", package = "llm-dtype" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
tensor = { path = "../tensor", package = "llm-tensor" }
wire = { path = "../wire", package = "llm-wire" }
storage = { path = "../storage", package = "llm-storage" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }
storage = { path = "../storage", package = "llm-storage", features = ["mmap"] }
proptest = { workspace = true }

[lints]
workspace = true

[[test]]
name = "round_trip"
path = "tests/round_trip.rs"

[[test]]
name = "prop_json"
path = "tests/prop_json.rs"
