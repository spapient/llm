# NVIDIA 档案（P0 只有 L0/L1：本机没有 CUDA 设备，无法产生 L2 见证）。
# 协商因此会拒绝这台设备——这正是 DESIGN §11.3"未验证的能力视为不具备"的落地行为。

[meta]
vendor   = "nvidia"
id       = "sm100"
emit     = "cuda"
tool     = "nvcc"
tool_ver = "13.3"
checked  = "2026-11-11"

[fingerprint]
cc   = "10.0..10.3"
name = "contains: B200|GB200"

[space]
GM   = "global"
FAST = "shared"
REG  = "register"

[mem]
FAST = { bytes = 233472, bank = 32 }
REG  = { bytes = 262144 }

[simt]
group      = 32
groups_max = 64

[peak]
flops_f32 = { value = 946.0e12, src = "132 SM * 128 lane * 2 flop * 2.8 GHz（sm100 口径）" }
bw        = { value = 8.0e12,  src = "HBM3e 2 stack * 4096 bit * 8 Gbps" }

[compile]
flags = ["-arch=sm_100a", "-O3"]
preamble = "#include <cuda_fp16.h>"

[[provides]]
prim  = "dot"
impl  = "dp4a"
dt    = ["i8", "i32"]
space = ["REG"]
lanes = ["4"]
grade = "L1"

[[provides]]
prim  = "quant"
impl  = "lop3_i4"
dt    = ["i4", "f32"]
space = ["REG", "GM"]
group = ["32"]
grade = "L1"

[[provides]]
prim  = "load"
impl  = "ld.global"
m     = "<=4096"
dt    = ["i4", "u8", "f32"]
space = ["GM", "FAST"]
src   = ["GM"]
dst   = ["GM"]
grade = "L1"

[[provides]]
prim  = "load_async"
impl  = "cp.async"
m     = "<=4096"
dt    = ["i4", "u8", "f32"]
space = ["GM", "FAST"]
src   = ["GM"]
dst   = ["GM"]
stages = ["2", "3"]
grade = "L1"

[[provides]]
prim  = "commit_wait"
impl  = "cp.async.commit_group"
grade = "L1"

[[provides]]
prim  = "store"
impl  = "st.global"
m     = "<=4096"
dt    = ["f32"]
space = ["GM"]
grade = "L1"

[[provides]]
prim  = "bar"
impl  = "bar.sync"
grade = "L1"

[[provides]]
prim  = "cvt"
impl  = "cvt.rn"
dt    = ["f32", "i32", "i8"]
sat   = ["on", "off"]
grade = "L1"

[[provides]]
prim  = "reduce"
impl  = "shfl.bfly"
axis  = ["GMAX"]
op    = ["sum", "max"]
dt    = ["f32"]
grade = "L1"

[[provides]]
prim  = "atomic"
impl  = "red.global"
dt    = ["f32"]
space = ["GM"]
op    = ["add", "max"]
grade = "L1"
