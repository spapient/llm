[package]
name = "cutile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Device-agnostic kernel DSL: capability negotiation, fragment assembly, emit, and the doctor/verify/bench reports computed on top of it."
readme = "DESIGN.md"
publish = false

[dependencies]
annotation = { path = "../annotation", package = "llm-annotation" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
prim = { path = "../prim", package = "llm-prim" }
llm-config = { path = "../config" }
op = { path = "../op", package = "llm-op" }
prof = { path = "../prof", package = "llm-prof" }

[features]
# 把设备镜像的开关透传下去：`cutile` 是消费片段层的机制层，发布时它才是用镜像的那一段。
device-image = ["prim/device-image"]

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true
