# P0 算子：weight-only int4 解码 GEMV。
# 选它的理由（DESIGN §16）：带宽受限、无布局推导、roofline 好算、三台设备都能跑。

[op]
name     = "gemv_i4"
skeleton = "gemm"
summary  = "y[n] = Σ_g scale[n,g] · dot(dequant(w[n, g·G : g·G+G]), x[g·G : g·G+G])"

# 轴展开成 tile 候选（DESIGN §4.1）：GMAX 是反量化缓冲的上界，也是 reduce 的轴名。
[axes]
GMAX = [32, 64]

# 算子级公共需求：能力签名，不是字符串数组。
[needs]
quant  = { dt = ["i4", "f32"], space = ["REG", "GM"], group = ["32"] }
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
load   = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt    = { dt = ["f32", "i32"], sat = ["off"] }
reduce = { axis = ["GMAX"], op = ["sum"], dt = ["f32"] }

# 布局契约：槽位 → 闭集构造子。
[layouts]
w = "row"
x = "row"

# 降级链：order 小者优先；变体级增量需求写在 extra_needs 里，
# 这样 direct 不需要 load_async 这件事才能在数据里表达出来。
[[variants]]
name      = "pipe2"
order     = 1
schedule  = "pipe<2>"
mma_share = 0.62
extra_needs.load_async  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"], stages = ["2"] }
extra_needs.commit_wait = {}
extra_needs.bar         = {}

[[variants]]
name      = "direct"
order     = 2
schedule  = "direct"
mma_share = 0.35
