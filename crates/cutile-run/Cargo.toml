[package]
name = "cutile-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Execution half of the cutile DSL: backend seams, compile/run primitives, witness, and the doctor/verify/bench reports."
readme = "README.md"
publish = false
# tests/ 下是经 src 模块 #[path] 挂回的白盒单测，不作为独立集成测试目标自动编译。
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
prim = { path = "../prim", package = "llm-prim" }
op = { path = "../op", package = "llm-op" }
prof = { path = "../prof", package = "llm-prof" }
cutile = { path = "../cutile" }

[features]
# 见证要按设备读片段层内置的源文本，因此镜像开关除了透传给 `cutile` 还要透传给 `prim`。
device-image = ["prim/device-image", "cutile/device-image"]

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true
