[package]
name = "llm-diagnostic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Std-only L1 base: the workspace's single error type, exit-code contract and rendering primitives."
publish = false
autotests = false

[dependencies]
# 仅在 `build` feature 下、供各 crate 的 build.rs 使用；默认 feature 保持纯 std、零依赖。
toml = { workspace = true, optional = true }

[features]
default = []
# 纯 std 构建期原语：路径文件名与目录扫描；不引入 toml。
build-std = []
# 构建期共享内核：build-std 原语 + TOML 扫描/读取/取值/合并，各生成器直产强类型静态视图。
build = ["build-std", "dep:toml"]

[lints]
workspace = true
