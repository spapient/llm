[package]
name = "llm-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Device-source lowering and vendor backends: CUDA / Metal / Ascend source emission, compilation and drivers, plus the six-platform execution contract."
publish = false
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
cutile = { path = "../cutile", package = "cutile" }
llm-optim = { path = "../shard", package = "llm-shard" }
nn = { path = "../nn", package = "llm-nn" }
prof = { path = "../prof", package = "llm-prof" }
engine = { path = "../engine", package = "llm-engine" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[[test]]
name = "schedule"
path = "tests/schedule.rs"

[[test]]
name = "metal_suite"
path = "tests/metal_suite.rs"