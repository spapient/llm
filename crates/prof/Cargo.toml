[package]
name = "llm-prof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Archive layer: per-device capability archives consumed by cutile."
readme = "README.md"
publish = false
autotests = false
# 构建脚本已迁入 src/，Cargo 必须显式指向它，否则 OUT_DIR 生成表不会生成。
build = "src/build.rs"

[features]
# 构建期真编设备镜像（`build.rs` 调 `xcrun metal`）。默认只有源码：镜像要工具链、要时间，
# 缺了就只是 `Status::NoRecipe` / `Status::Skipped` 一行原因，构建不因此失败。
device-image = []
# 端口峰值探针（`native::gemm8x8::port_fma` / `native::sme::port_run`）：nn 的 `bench` 特性
# 转发到这里，生产构建不带。
bench = []

[dependencies]
# 契约词汇（`atom`/`sig`/`sch`/`tpl`/`einsum`/`model`/`sample`/`operator`/`epilogue`）
# 与档案同住本 crate：模板与签名是设备档案与片段正文的共同文法，拆开只会多一层转发。
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
dtype = { path = "../dtype", package = "llm-dtype" }
# 算子语料编译期展开：`prof_ops!()` 在宏进程读 `src/ops/*.toml`，展开成 `const [OpView]`；
# annotation 不反向依赖 prof（生成代码用全限定路径），方向无环。宏依赖只活在编译器进程。
annotation = { path = "../annotation", package = "llm-annotation" }
# 半精度样本取值（`Values::F16`/`Bf16`）：与 nn 的 `Scalar` 半精度档共用同一份 IEEE 编解码。
half = { workspace = true }

# Intel OpenCL 的受控 FFI 与 RAII 句柄住在 `runtime::opencl`，不引入额外包装依赖。

[dev-dependencies]
# 片段层对账用例（`device_suite!`）在独立集成测试里，以外部 `prof::` 引用本 crate；
# 因此本 crate 的测试面需要 testkit，而 testkit 本身不依赖 prof，不成环。
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true

[[test]]
name = "fragments"
path = "tests/fragments.rs"

[build-dependencies]
# 构建期共享内核（扫描/读取/生成）在 diagnostic 的 build feature 下，运行期不引入 toml。
diagnostic = { path = "../diagnostic", package = "llm-diagnostic", features = ["build"] }
# 档案本身就是 TOML：生成期要读 `[meta]` 与 `[[provides]]` 做构建期校验。
toml = { workspace = true }
# 同一 gemm_micro.k 在构建期生成并静态链接主机微内核，运行时不调用编译器。
cc = { workspace = true }
