# MUSA 档案：MTT S4000 / mp_22 真机口径。
#
# 硬件数字来自本机 `musaGetDeviceProperties` 实测（cc 2.2、56 SM、warpSize 128、
# sharedMemPerBlock 73728、regsPerBlock 131072、memoryBusWidth 384、memoryClockRate 8012000 kHz、
# clockRate 1791000 kHz），峰值用可求值 `src` 表达且与 `value` 相等，不凭记忆。
#
# `tool_ver` 记 `mcc --version` 实际报的 clang 版本（14.0.0）；MUSA SDK 是 5.2.0，两者不是同一个编号，
# 草案原先写 5.2.0，`doctor` 每次都报"档案登记与实测不一致"——档案记的是工具自报值，不是 SDK 名。
#
# 与 nvidia 的关系：**同一门输出语言**（`emit = "cuda"`），不同工具链（`tools = "mcc"`，clang-14 驱动）。
# 因此 `prim/musa` 的片段与 `prim/nvidia` 逐段同构、只在能证明更强的地方不同（`quant` 四位一组
# 展开）；`dot` 的四链 ILP 会改变求和次序，属另一条签名，在没提供对应见证之前不冒充 `dot/fma`。
# `engine` 侧的后端只按 `[meta].tools` 决定命令名与运行时头。

[meta]
vendor   = "musa"
id       = "mp_22"
emit     = "cuda"
tools    = "mcc"
tool_ver = "14.0.0"
checked  = "2026-11-20"

[fingerprint]
cc   = "2.2"
name = "contains: S4000"

[space]
GM   = "global"
FAST = "shared"
REG  = "register"

[mem]
# sharedMemPerBlock = sharedMemPerMultiprocessor = 73728（72 KiB，无上限裁剪）。
# `bank` 不填：MUSA 未公开 share memory 的 bank 数，填一个 32 会把"未知"变成"事实"。
FAST = { bytes = 73728 }
# regsPerBlock = 131072 个 32 bit 寄存器 → 524288 字节。
REG  = { bytes = 524288 }

[simt]
# warpSize = 128（S4000 的 wave 宽度，与 CUDA 的 32 不同：任何按 32 写死的波内归约在这张卡上都错）。
group      = 128
# 56 SM × 1024 thread/SM ÷ 128 lane = 448 个常驻波。
groups_max = 448

[peak]
# 56 SM × 128 FP32 lane/SM × 2（FMA）× 1.791 GHz = 25.6758 TFLOPS。
flops_f32 = { value = 25.675776e12, src = "56*128*2*1.791e9" }
# 384 bit GDDR6，DDR 计 2 × 8.012 GHz：384/8*2*8.012e9 = 769.152 GB/s。
bw        = { value = 769.152e9, src = "384/8*2*8.012e9" }

[compile]
flags = [
    "-x", "musa",
    "--cuda-gpu-arch=mp_22",
    "-O3",
    "-L/usr/local/musa/lib", "-lmusart",
]
# 工具链垫片：生成的程序只写一种头文件名，MUSA 只提供 `musa_*.h`，映射写在档案里。
# 两个编译路径（算子产物 / 见证）都从这张表落地，不再各写一份。
preamble = """
#ifndef __host__
#define __host__
#endif
#ifndef __device__
#define __device__
#endif
__host__ __device__ float _cutile_exp_f32(float x) { return expf(x); }
__host__ __device__ float _cutile_log_f32(float x) { return logf(x); }
__host__ __device__ float _cutile_sum_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += a[i * stride];
    return acc;
}
__host__ __device__ float _cutile_sumsq_f32(const float *a, int n, int stride) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) { float x = a[i * stride]; acc += x * x; }
    return acc;
}
__host__ __device__ float _cutile_max_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = -3.402823466e38f;
    for (int i = 0; i < n; ++i) { float x = a[i * stride]; if (x > acc) acc = x; }
    return acc;
}
__host__ __device__ float _cutile_exp_sum_f32(const float *x, int n, int stride, float max) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += _cutile_exp_f32(x[i * stride] - max);
    return acc;
}
__host__ __device__ void _cutile_exp_norm_f32(float *y, const float *x, int n, int stride, float max, float sum) {
    for (int i = 0; i < n; ++i) y[i * stride] = _cutile_exp_f32(x[i * stride] - max) / sum;
}
__host__ __device__ float _cutile_sqrt_f32(float x) { return sqrtf(x); }
__host__ __device__ float _cutile_sin_f32(float x) { return sinf(x); }
__host__ __device__ float _cutile_cos_f32(float x) { return cosf(x); }
__host__ __device__ float _cutile_pow_f32(float x, float y) { return powf(x, y); }
"""

# 等级口径（本档案的判据，不是抄来的分档）：
#   L2 = 见证在**本机**执行过、对拍通过，且产物模板**真的用到**这条签名；
#   L1 = 有片段/见证源码、本机也能编能跑，但还没接进任何产物路径（接进去的那天再升，不用提前吹）。
# 2026-11-20 实测：`cutile verify --op gemv_i4 --devices musa` → ✓ L2，max_rel_err 0.000e0，
# 17 条见证全部设备执行；其中 9 条是 gemv_i4 的生产路径所需，故为 L2。

[[provides]]
prim    = "dot"
impl    = "dp4a"
dt      = ["i8", "i32"]
space   = ["REG"]
lanes   = ["4"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_dot_i8", expect = [10.0] }

# P0 模板的 `@dot` 是标量 f32 累加，与上面的整数点积不是同一个指令：单独一条签名。
[[provides]]
prim    = "dot"
impl    = "fma"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "quant"
impl    = "unpack"
dt      = ["i2", "i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_quant", expect = [-4.0, 3.5] }

[[provides]]
prim    = "load"
impl    = "ld.global"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_load", expect = [1.0] }

[[provides]]
prim    = "load_async"
impl    = "cp.async+prefetch"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["2", "3"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_load_async", expect = [1.0] }

[[provides]]
prim    = "commit_wait"
impl    = "cp.async.commit_group"
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_commit_wait", expect = [0.0] }

[[provides]]
prim    = "store"
impl    = "st.global"
m       = "<=4096"
dt      = ["f32"]
space   = ["GM"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_store", expect = [3.25] }

[[provides]]
prim    = "bar"
impl    = "bar.sync"
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "cvt.rn"
dt      = ["f32", "i32", "i8"]
sat     = ["on", "off"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "shfl.bfly"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L2"
witness = { file = "musa/witness.cu", func = "witness_reduce", expect = [7.5] }

# 以下 8 条保持 L1：见证证明的是**语义**（取数/广播/前缀和/矩阵乘），不是指令本身。
# 把它们升成 L2 需要一条真正用到该指令的产物路径；在那之前写 L2 就是把"能编"说成"已验证"。

[[provides]]
prim    = "atomic"
impl    = "red.global"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_atomic", expect = [5.0] }

# mp_22 的矩阵核：MUSA 的 WMMA 是 16×16×8 一族（`t_wmma_v4…v7` 实测全部编得过、tf32 版
# 10.60 TFLOPS 居首）。P0 模板不用它，故等级 L1——"本机能编能跑，但还没接进产物"。
[[provides]]
prim     = "mma"
impl     = "wmma.tf32"
m        = "16"
n        = "16"
k        = "8"
dt       = ["f32"]
space    = ["REG", "FAST"]
accuracy = ["fp32"]
grade    = "L1"
witness  = { file = "musa/witness.cu", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

[[provides]]
prim    = "shuffle"
impl    = "shfl.idx"
m       = "<=128"
dt      = ["f32", "i32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_shuffle", expect = [8.0, 7.0, 6.0, 5.0, 4.0, 3.0, 2.0, 1.0] }

[[provides]]
prim    = "broadcast"
impl    = "shfl.idx.bcast"
m       = "<=128"
dt      = ["f32"]
space   = ["REG"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_broadcast", expect = [7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0, 7.0] }

[[provides]]
prim    = "scan"
impl    = "shfl.up"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0, 15.0, 21.0, 28.0, 36.0] }

[[provides]]
prim    = "exp2"
impl    = "ex2.approx"
dt      = ["f32"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim    = "rcp"
impl    = "rcp.approx"
dt      = ["f32"]
grade   = "L1"
witness = { file = "musa/witness.cu", func = "witness_rcp", expect = [0.25, 0.5] }

[compile.headers]
"cuda_runtime.h" = """
#pragma once
#include <musa_runtime.h>
#define cudaError_t musaError_t
#define cudaSuccess musaSuccess
#define cudaMalloc musaMalloc
#define cudaFree musaFree
#define cudaMemcpy musaMemcpy
#define cudaMemcpyHostToDevice musaMemcpyHostToDevice
#define cudaMemcpyDeviceToHost musaMemcpyDeviceToHost
#define cudaDeviceSynchronize musaDeviceSynchronize
#define cudaGetErrorString musaGetErrorString
"""
"cuda_fp16.h" = """
#pragma once
#include <musa_fp16.h>
"""
