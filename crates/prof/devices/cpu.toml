# CPU 档案（P0 的真机后端）。
# 三级存储映射到 CPU 的真实层级：GM = 主存，FAST = L2 分块缓冲，REG = 寄存器/栈。
# 证据等级说明：L2 = 与参考实现对拍通过，且每条 `provides` 的见证（file + func + expect）
# 都被 `cutile verify` 真的编译执行过；L0 = 有见证源码、没有片段文本。末尾五条（`atomic`
# 与闭集里 CPU 真正具备的四条）是 L0：协商照样把它们当作不具备，这正是"未验证的能力
# 视为不具备"的负例。闭集里的 `shuffle` / `broadcast` 刻意不声明：`[simt].group = 1`
# 的单 lane 设备没有可交换的对象。

[meta]
vendor   = "cpu"
id       = "portable"
emit     = "c"
tool     = "cc"
tool_ver = "clang-17"
checked  = "2026-11-11"

[fingerprint]
arch = "x86_64|aarch64"

[space]
GM   = "main"
FAST = "L2"
REG  = "stack"

[mem]
FAST = { bytes = 524288, bank = 16 }
REG  = { bytes = 65536 }

[simt]
group      = 1
groups_max = 1

[peak]
# 8 核 × 2.6 GHz × 8 条 f32 流水 × 2 FLOP/cycle（顺序 f32 口径）。
# `src` 必须可求值且与 `value` 相等：量纲与含义写在这里，数字只写一次。
flops_f32 = { value = 332.8e9,  src = "8*2.6e9*8*2" }
# 2 通道 × 8 字节 × 2666 MHz。
bw        = { value = 42.656e9, src = "2*8*2666e6" }

[compile]
flags = ["-O3", "-std=c99"]
preamble = "#include <stdint.h>\n#include <string.h>\n#if defined(__aarch64__)\n#include <arm_neon.h>\n#endif\n/* 归约独立接口：统一数组入口 (a, n, stride)；n==1 走标量快通道，n>1 按步长数组归约。\n   双通道判断与遍历封装在这里，模板业务代码只调一行，不掺和分支。 */\nstatic inline float _cutile_sum_f32(const float *a, int n, int stride) { if (n == 1) { return a[0]; } float acc = 0.0f; for (int i = 0; i < n; ++i) { acc += a[i * stride]; } return acc; }\nstatic inline float _cutile_max_f32(const float *a, int n, int stride) { if (n == 1) { return a[0]; } float acc = -3.402823466e38f; for (int i = 0; i < n; ++i) { const float x = a[i * stride]; if (x > acc) { acc = x; } } return acc; }"

[[provides]]
prim    = "quant"
impl    = "scalar_i4"
dt      = ["i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_quant", expect = [-4.0, 3.5] }

[[provides]]
prim    = "dot"
impl    = "scalar_f32"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "load"
impl    = "memcpy"
m       = "<=65536"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_load", expect = [1.0] }

[[provides]]
prim    = "load_async"
impl    = "memcpy_prefetch"
m       = "<=65536"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["2", "3"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_load_async", expect = [1.0] }

[[provides]]
prim    = "commit_wait"
impl    = "noop"
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_commit_wait", expect = [0.0] }

[[provides]]
prim    = "store"
impl    = "memcpy_out"
m       = "<=65536"
dt      = ["f32"]
space   = ["GM", "REG"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_store", expect = [3.25] }

[[provides]]
prim    = "bar"
impl    = "noop"
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "c_cast"
dt      = ["f32", "i32", "i8"]
sat     = ["on", "off"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "scalar_loop"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_reduce", expect = [7.5] }

# 单线程 CPU 只有读改写，没有多线程原子语义；也没有片段文本，所以是 L0——
# 协商会把它当成"不具备"，这正是这条声明要演示的东西。
[[provides]]
prim    = "atomic"
impl    = "rmw_scalar"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_atomic", expect = [5.0] }

# ── 闭集其余四条：CPU 真的能算，但 P0 模板不调用 ────────────────────────────
# 与加速器的同六条（`mma`/`shuffle`/`broadcast`/`scan`/`exp2`/`rcp`）不同，这里少了
# `shuffle`/`broadcast`：它们要求 `[simt].group > 1`，单 lane 设备声明它们就是伪造证据。
# 这四条没有片段文本，等级因此是 L0——矩阵补的是覆盖，不是等级。
[[provides]]
prim     = "mma"
impl     = "scalar_tile"
m        = "<=8"
n        = "<=8"
k        = "<=8"
dt       = ["f32"]
space    = ["REG"]
accuracy = ["fp32"]
grade    = "L0"
witness  = { file = "cpu/witness.c", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

# 单线程前缀和：`sum` 与 `max` 走同一段循环，只是结合运算不同。
[[provides]]
prim    = "scan"
impl    = "prefix_loop"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0] }

[[provides]]
prim    = "exp2"
impl    = "pow2_loop"
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim    = "rcp"
impl    = "recip_newton"
dt      = ["f32"]
space   = ["REG"]
kind    = ["rcp", "rsqrt"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_rcp", expect = [0.25, 0.5] }
