# CPU 档案（P0 的真机后端）。
# 三级存储映射到 CPU 的真实层级：GM = 主存，FAST = L2 分块缓冲，REG = 寄存器/栈。
# 证据等级说明：L2 = 与参考实现对拍通过，且每条 `provides` 的见证（file + func + expect）
# 都被 `cutile verify` 真的编译执行过；L0 = 有见证源码、没有片段文本。末尾五条（`atomic`
# 与闭集里 CPU 真正具备的四条）是 L0：协商照样把它们当作不具备，这正是"未验证的能力
# 视为不具备"的负例。闭集里的 `shuffle` / `broadcast` 刻意不声明：`[simt].group = 1`
# 的单 lane 设备没有可交换的对象。

[meta]
vendor   = "cpu"
id       = "portable"
emit     = "c"
tool     = "cc"
# `cc` 在 macOS 上是 clang、在多数 Linux 上是 gcc：可移植档案不能写死主版本号。`*` 是显式的
# "任意版本"（`Toolchain::agrees_with`），实测值仍进产物身份与报告。
tool_ver = "*"
checked  = "2026-11-11"

[fingerprint]
arch = "x86_64|aarch64"

[space]
GM   = "main"
FAST = "L2"
REG  = "stack"

[mem]
FAST = { bytes = 524288, bank = 16 }
REG  = { bytes = 65536 }

[simt]
group      = 1
groups_max = 1

[peak]
# 8 核 × 2.6 GHz × 8 条 f32 流水 × 2 FLOP/cycle（顺序 f32 口径）。
# `src` 必须可求值且与 `value` 相等：量纲与含义写在这里，数字只写一次。
flops_f32 = { value = 332.8e9,  src = "8*2.6e9*8*2" }
# 2 通道 × 8 字节 × 2666 MHz。
bw        = { value = 42.656e9, src = "2*8*2666e6" }

[compile]
flags = ["-O3", "-std=c99"]
preamble = """
#include <stdint.h>
#include <string.h>
#include <math.h>
#if defined(__aarch64__)
#include <arm_neon.h>
#endif
/* 归约独立接口：统一数组入口 (a, n, stride)；n==1 走标量快通道，n>1 按步长数组归约。
   双通道判断与遍历封装在这里，模板业务代码只调一行，不掺和分支。
   aarch64 且 stride==1 走 NEON 连续归约：四累加器打破单条加法/取大依赖链；余下元素按
   4-wide 收口、标量补齐。stride>1 或其余架构回退顺序标量折叠。向量分路累加顺序与标量
   参考不同，数值以内核对拍为准（f32 阈值 1e-5）；max 对有限输入取大，NaN 边界由算子层守。 */
static inline float _cutile_sum_f32(const float *a, int n, int stride) {
    if (n == 1) { return a[0]; }
#if defined(__aarch64__)
    if (stride == 1) {
        float32x4_t s0 = vdupq_n_f32(0.0f);
        float32x4_t s1 = vdupq_n_f32(0.0f);
        float32x4_t s2 = vdupq_n_f32(0.0f);
        float32x4_t s3 = vdupq_n_f32(0.0f);
        int k = 0;
        for (; k + 16 <= n; k += 16) {
            s0 = vaddq_f32(s0, vld1q_f32(a + k));
            s1 = vaddq_f32(s1, vld1q_f32(a + k + 4));
            s2 = vaddq_f32(s2, vld1q_f32(a + k + 8));
            s3 = vaddq_f32(s3, vld1q_f32(a + k + 12));
        }
        s0 = vaddq_f32(vaddq_f32(s0, s1), vaddq_f32(s2, s3));
        for (; k + 4 <= n; k += 4) {
            s0 = vaddq_f32(s0, vld1q_f32(a + k));
        }
        float32x2_t lo = vget_low_f32(s0);
        float32x2_t hi = vget_high_f32(s0);
        lo = vadd_f32(lo, hi);
        lo = vpadd_f32(lo, lo);
        float acc = vget_lane_f32(lo, 0);
        for (; k < n; ++k) { acc += a[k]; }
        return acc;
    }
#endif
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) { acc += a[i * stride]; }
    return acc;
}
static inline float _cutile_max_f32(const float *a, int n, int stride) {
    if (n == 1) { return a[0]; }
#if defined(__aarch64__)
    if (stride == 1) {
        float32x4_t m0 = vdupq_n_f32(-3.402823466e38f);
        float32x4_t m1 = vdupq_n_f32(-3.402823466e38f);
        float32x4_t m2 = vdupq_n_f32(-3.402823466e38f);
        float32x4_t m3 = vdupq_n_f32(-3.402823466e38f);
        int k = 0;
        for (; k + 16 <= n; k += 16) {
            m0 = vmaxq_f32(m0, vld1q_f32(a + k));
            m1 = vmaxq_f32(m1, vld1q_f32(a + k + 4));
            m2 = vmaxq_f32(m2, vld1q_f32(a + k + 8));
            m3 = vmaxq_f32(m3, vld1q_f32(a + k + 12));
        }
        m0 = vmaxq_f32(vmaxq_f32(m0, m1), vmaxq_f32(m2, m3));
        for (; k + 4 <= n; k += 4) {
            m0 = vmaxq_f32(m0, vld1q_f32(a + k));
        }
        float acc = vmaxvq_f32(m0);
        for (; k < n; ++k) { const float x = a[k]; if (x > acc) acc = x; }
        return acc;
    }
#endif
    float acc = -3.402823466e38f;
    for (int i = 0; i < n; ++i) { const float x = a[i * stride]; if (x > acc) acc = x; }
    return acc;
}
/* 软件向量 exp：softmax 减行 max 后 t<=0；激活（silu/gelu）也会给正指数，实际区间约 [-88, 88]。
   规约 exp(t)=2^k·exp(r)，|r|<=ln2/2，5 次 Taylor Horner，2^k 走位模式；aarch64+连续走 NEON
   4-wide，余回退标量。近似相对误差 ≤2e-6（阈值 1e-5），下溢置 0、上溢置 inf。exp 不进原语闭集，
   与 sum/max 同挂 preamble；闭集 exp2 片段按 ADR 0027 仍推迟。 */
static const float _cutile_exp_log2e  = 1.4426950408889634f;
static const float _cutile_exp_ln2_hi = 0.693145751953125f;
static const float _cutile_exp_ln2_lo = 1.4286067653301870e-6f;

static inline float _cutile_exp_f32(float t) {
    if (t < -87.330f) return 0.0f;
    float z = t * _cutile_exp_log2e;
    int k = (int)z;
    if (z >= 0.0f) { if (z - (float)k >= 0.5f) k += 1; } else if ((float)k - z > 0.5f) { k -= 1; }
    if (k < -126) return 0.0f;
    if (k >= 128) { union { uint32_t u; float f; } inf; inf.u = 0x7F800000u; return inf.f; }
    float kr = (float)k;
    float r = t - kr * _cutile_exp_ln2_hi - kr * _cutile_exp_ln2_lo;
    float p = 1.0f + r * (1.0f + r * (0.5f + r * (1.0f/6.0f + r * (1.0f/24.0f + r * (1.0f/120.0f)))));
    union { uint32_t u; float f; } twop;
    twop.u = (uint32_t)(127 + k) << 23;
    return p * twop.f;
}
/* log 与 exp 不同：定义域 (0,+∞)，域内 libm logf 相对误差 <1 ulp，远小于阈值 1e-5，
   无需位精确软件实现；与 Rust 参考 `f32::ln` 同走 libm，主机侧逐位一致。 */
static inline float _cutile_log_f32(float x) { return logf(x); }
/* sqrt / sin / cos / pow：与 log 同理走 libm。sqrtf 在 IEEE 下要求正确舍入（误差 ≤0.5 ulp），
   与设备侧的 `sqrt` 逐位一致；sin/cos/pow 的 libm 与 Metal 的 `metal::sin/cos/pow` 都是 1 ulp
   量级，比阈值 1e-5 小三个数量级。rope 与两个注意力算子用得上，早先缺口在这四个名字上，
   C 参考因此根本编不过——参考车道不通，真机结论就无从判定对错。 */
static inline float _cutile_sqrt_f32(float x) { return sqrtf(x); }
static inline float _cutile_sin_f32(float x) { return sinf(x); }
static inline float _cutile_cos_f32(float x) { return cosf(x); }
static inline float _cutile_pow_f32(float x, float y) { return powf(x, y); }
#if defined(__aarch64__)
static inline float32x4_t _cutile_exp4_f32(float32x4_t x) {
    float32x4_t kv = vrndaq_f32(vmulq_f32(x, vdupq_n_f32(_cutile_exp_log2e)));
    int32x4_t k = vcvtq_s32_f32(kv);
    float32x4_t kr = vcvtq_f32_s32(k);
    float32x4_t r = vsubq_f32(x, vmulq_f32(kr, vdupq_n_f32(_cutile_exp_ln2_hi)));
    r = vsubq_f32(r, vmulq_f32(kr, vdupq_n_f32(_cutile_exp_ln2_lo)));
    float32x4_t p = vdupq_n_f32(1.0f/120.0f);
    p = vfmaq_f32(vdupq_n_f32(1.0f/24.0f), r, p);
    p = vfmaq_f32(vdupq_n_f32(1.0f/6.0f), r, p);
    p = vfmaq_f32(vdupq_n_f32(0.5f), r, p);
    p = vfmaq_f32(vdupq_n_f32(1.0f), r, p);
    p = vfmaq_f32(vdupq_n_f32(1.0f), r, p);
    int32x4_t e = vshlq_n_s32(vaddq_s32(k, vdupq_n_s32(127)), 23);
    uint32x4_t under = vcltq_s32(k, vdupq_n_s32(-126));
    uint32x4_t over = vreinterpretq_u32_s32(vcgeq_s32(k, vdupq_n_s32(128)));
    float32x4_t res = vmulq_f32(p, vreinterpretq_f32_s32(e));
    res = vbslq_f32(over, vreinterpretq_f32_u32(vdupq_n_u32(0x7F800000u)), res);
    return vreinterpretq_f32_s32(vandq_s32(vreinterpretq_s32_f32(res),
        vreinterpretq_s32_u32(vmvnq_u32(under))));
}
#endif
static inline float _cutile_exp_sum_f32(const float *x, int n, int stride, float max) {
#if defined(__aarch64__)
    if (stride == 1) {
        float32x4_t s0 = vdupq_n_f32(0.0f), s1 = vdupq_n_f32(0.0f);
        int k = 0;
        for (; k + 8 <= n; k += 8) {
            s0 = vaddq_f32(s0, _cutile_exp4_f32(vsubq_f32(vld1q_f32(x+k), vdupq_n_f32(max))));
            s1 = vaddq_f32(s1, _cutile_exp4_f32(vsubq_f32(vld1q_f32(x+k+4), vdupq_n_f32(max))));
        }
        s0 = vaddq_f32(s0, s1);
        for (; k + 4 <= n; k += 4) s0 = vaddq_f32(s0, _cutile_exp4_f32(vsubq_f32(vld1q_f32(x+k), vdupq_n_f32(max))));
        float32x2_t lo = vget_low_f32(s0), hi = vget_high_f32(s0);
        lo = vpadd_f32(vadd_f32(lo, hi), lo);
        float acc = vget_lane_f32(lo, 0);
        for (; k < n; ++k) acc += _cutile_exp_f32(x[k] - max);
        return acc;
    }
#endif
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += _cutile_exp_f32(x[i*stride] - max);
    return acc;
}
static inline void _cutile_exp_norm_f32(float *y, const float *x, int n, int stride, float max, float sum) {
#if defined(__aarch64__)
    if (stride == 1) {
        float32x4_t vsum = vdupq_n_f32(sum);
        int k = 0;
        for (; k + 4 <= n; k += 4) {
            float32x4_t e = _cutile_exp4_f32(vsubq_f32(vld1q_f32(x+k), vdupq_n_f32(max)));
            vst1q_f32(y+k, vdivq_f32(e, vsum));
        }
        for (; k < n; ++k) y[k] = _cutile_exp_f32(x[k] - max) / sum;
        return;
    }
#endif
    for (int i = 0; i < n; ++i) y[i*stride] = _cutile_exp_f32(x[i*stride] - max) / sum;
}
"""

[[provides]]
prim    = "quant"
impl    = "unpack"
dt      = ["i2", "i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_quant", expect = [-4.0, 3.5] }

[[provides]]
prim    = "dot"
impl    = "scalar_f32"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "load"
impl    = "memcpy"
m       = "<=65536"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_load", expect = [1.0] }

[[provides]]
prim    = "load_async"
impl    = "memcpy_prefetch"
m       = "<=65536"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["2", "3"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_load_async", expect = [1.0] }

[[provides]]
prim    = "commit_wait"
impl    = "noop"
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_commit_wait", expect = [0.0] }

[[provides]]
prim    = "store"
impl    = "memcpy_out"
m       = "<=65536"
dt      = ["f32"]
space   = ["GM", "REG"]
align   = ["1"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_store", expect = [3.25] }

[[provides]]
prim    = "bar"
impl    = "noop"
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "c_cast"
dt      = ["f32", "i32", "i8"]
sat     = ["on", "off"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "scalar_loop"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L2"
witness = { file = "cpu/witness.c", func = "witness_reduce", expect = [7.5] }

# 单线程 CPU 只有读改写，没有多线程原子语义；也没有片段文本，所以是 L0——
# 协商会把它当成"不具备"，这正是这条声明要演示的东西。
[[provides]]
prim    = "atomic"
impl    = "rmw_scalar"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_atomic", expect = [5.0] }

# ── 闭集其余四条：CPU 真的能算，但 P0 模板不调用 ────────────────────────────
# 与加速器的同六条（`mma`/`shuffle`/`broadcast`/`scan`/`exp2`/`rcp`）不同，这里少了
# `shuffle`/`broadcast`：它们要求 `[simt].group > 1`，单 lane 设备声明它们就是伪造证据。
# 这四条没有片段文本，等级因此是 L0——矩阵补的是覆盖，不是等级。
[[provides]]
prim     = "mma"
impl     = "scalar_tile"
m        = "<=8"
n        = "<=8"
k        = "<=8"
dt       = ["f32"]
space    = ["REG"]
accuracy = ["fp32"]
grade    = "L0"
witness  = { file = "cpu/witness.c", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

# 单线程前缀和：`sum` 与 `max` 走同一段循环，只是结合运算不同。
[[provides]]
prim    = "scan"
impl    = "prefix_loop"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0] }

[[provides]]
prim    = "exp2"
impl    = "pow2_loop"
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim    = "rcp"
impl    = "recip_newton"
dt      = ["f32"]
space   = ["REG"]
kind    = ["rcp", "rsqrt"]
grade   = "L0"
witness = { file = "cpu/witness.c", func = "witness_rcp", expect = [0.25, 0.5] }
