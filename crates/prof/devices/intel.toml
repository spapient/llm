# Intel GPU 档案（P0 只有 L1：见证已写成数据，本机没有 Intel GPU，OpenCL 片段与见证都未执行过）。
# 保留它是为了让"同一份模板、三台设备"在数据上成立，而不是靠口号。
#
# 同一原语可以有多条 `provides`：`dot` 的 `dp4a`（i8×4）与 `fma`（标量 f32）是两种
# 能力，合并成一条会变成少写字段。

[meta]
vendor   = "intel"
id       = "gen12"
emit     = "opencl"
tools    = "clang"
tool_ver = "17.0"
checked  = "2026-11-11"

[fingerprint]
name = "contains: Intel"
arch = "gen12"

[space]
GM   = "global"
FAST = "slm"
REG  = "private"

[mem]
FAST = { bytes = 65536, bank = 16 }
REG  = { bytes = 32768 }

[simt]
group      = 16
groups_max = 32

[peak]
# 96 EU × 8 lane × 2 flop × 1.35 GHz。
# `src` 必须可求值且与 `value` 相等：量纲与含义写在这里，数字只写一次。
flops_f32 = { value = 2.0736e12, src = "96*8*2*1.35e9" }
# LPDDR5 128 bit（16 B）× 4266 MT/s。
bw        = { value = 68.256e9,  src = "16*4266e6" }

[compile]
flags = ["-cl-std=CL2.0"]
# 设备侧折叠函数与软件数学接口：`@reduce` 的 `$func` 就指到这里（`_cutile_sum_f32` /
# `_cutile_max_f32`），`exp`/`softmax` 一族还会用 `_cutile_exp_*`。早先这段是空的，于是
# `reduce` 片段只能退化成 `($0) = ($1)`——多元素归约静默返回首元素；补上接口后片段才能与
# cpu/nvidia 同源。数学函数按 OpenCL C 的 gentype 重载写（`exp`/`log`/`sqrt`/`sin`/`cos`/`pow`
# 没有 `f` 后缀版本），相对误差 < 4 ulp，远小于 P0 阈值 1e-5。
preamble = """
static inline float _cutile_exp_f32(float x) { return exp(x); }
static inline float _cutile_log_f32(float x) { return log(x); }
static inline float _cutile_sqrt_f32(float x) { return sqrt(x); }
static inline float _cutile_sin_f32(float x) { return sin(x); }
static inline float _cutile_cos_f32(float x) { return cos(x); }
static inline float _cutile_pow_f32(float x, float y) { return pow(x, y); }
static inline float _cutile_sum_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += a[i * stride];
    return acc;
}
static inline float _cutile_max_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = -3.402823466e38f;
    for (int i = 0; i < n; ++i) { float x = a[i * stride]; if (x > acc) acc = x; }
    return acc;
}
static inline float _cutile_exp_sum_f32(const float *x, int n, int stride, float max) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += _cutile_exp_f32(x[i * stride] - max);
    return acc;
}
static inline void _cutile_exp_norm_f32(float *y, const float *x, int n, int stride, float max, float sum) {
    for (int i = 0; i < n; ++i) y[i * stride] = _cutile_exp_f32(x[i * stride] - max) / sum;
}
"""

[[provides]]
prim    = "dot"
impl    = "dp4a"
dt      = ["i8", "i32"]
space   = ["REG"]
lanes   = ["4"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_dot_i8", expect = [10.0] }

# P0 模板的 `@dot` 是标量 f32 累加，与上面的整数点积不是同一个指令：单独一条签名。
# 名字带 `4`：正文是四条互不相欠的 FMA 链（16-wide 步进、4-wide 收口），与 cuda/musa
# 共享的单链 `fma` 不是同一份源码——`prim` 的同构判据按实现名分组，两者不能同名。
[[provides]]
prim    = "dot"
impl    = "fma4"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "quant"
impl    = "i4_unpack"
dt      = ["i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_quant", expect = [-4.0, 3.5] }

# `load` 在这个拼接点上是**绑地址**：模板把 `w + n*M` 绑进私有指针，读发生在 `@dot` 的循环体里。
# 签名因此写 `bind` 而不是 `vload`——`vloadN` 要求地址空间已知，模板形参未限定（clang 视为
# `__private`），在这里调它只能凑出"看起来用了向量指令"的代码。`src = GM` 是地址指向的空间，
# `dst = REG` 是指针自己落的空间：GM 侧一个字节都没动。
[[provides]]
prim    = "load"
impl    = "bind"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_load", expect = [1.0] }

# `async_work_group_copy` 只搬 GM ↔ SLM；目标是私有指针时没有 DMA 可发，能发的是 `prefetch`
# （core 于 OpenCL 2.0，不改语义、不阻塞）。签名写实际发出的那条指令。
# `load_async` 的 `impl` 记的是正文真正发出来的东西，不是设备会不会那条指令：P0 的 emit 没有
# shared 落点，异步搬运也只能落 shared——所以这条只剩同步加载（intel 例外：`prefetch` 是语言
# 内建，真的发）。`stages` 因此记 1：正文每轮只发一次加载。`pipe<2>`/`pipe<3>` 的级数是调度侧
# 建模，不在能力签名里。
[[provides]]
prim    = "load_async"
impl    = "prefetch"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["1"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_load_async", expect = [1.0] }

[[provides]]
prim    = "store"
impl    = "global_store"
m       = "<=4096"
dt      = ["f32"]
space   = ["GM"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_store", expect = [3.25] }

[[provides]]
prim    = "cvt"
impl    = "convert_float"
dt      = ["f32", "i32", "i8"]
# 片段层一个原语只有一份正文（`FragmentSet::get`），正文做的是就近舍入、不饱和的转换。
# 登记 `on` 会让只要求 `on` 的算子静默拿到不饱和结果，所以只写真能交付的这一侧。
sat     = ["off"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "sub_group_reduce"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_reduce", expect = [7.5] }

# OpenCL 2.0 的全局原子（`atomic_fetch_add`）。与 `nvidia` / `ascend` 的同一原语对齐：
# 三台设备都声明了它，协商才不必为"哪台有原子"写特例。
[[provides]]
prim    = "atomic"
impl    = "atomic_add"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_atomic", expect = [5.0] }

# ── 闭集的其余六条 ──────────────────────────────────────────────────────────
# gen12 的 Xe 矩阵引擎（`dpas`）、subgroup 交换/广播/扫描与 `native_exp2` /
# `native_recip`。没有片段文本（P0 模板不调用），所以等级是 L0：
# "声明了 + 有见证源码"，不是"本机能跑"。
[[provides]]
prim     = "mma"
impl     = "dpas"
m        = "<=8"
n        = "<=16"
k        = "<=8"
dt       = ["f16", "bf16", "i8"]
space    = ["REG", "FAST"]
accuracy = ["fp32"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

# `sub_group_shuffle` / `sub_group_broadcast`：宽度受 `[simt].group = 16` 约束。
[[provides]]
prim    = "shuffle"
impl    = "sub_group_shuffle"
m       = "<=16"
dt      = ["f32", "i32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_shuffle", expect = [4.0, 3.0, 2.0, 1.0] }

[[provides]]
prim    = "broadcast"
impl    = "sub_group_broadcast"
m       = "<=16"
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_broadcast", expect = [7.0, 7.0, 7.0, 7.0] }

[[provides]]
prim    = "scan"
impl    = "sub_group_scan_inclusive_add"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0] }

[[provides]]
prim     = "exp2"
impl     = "native_exp2"
dt       = ["f32"]
space    = ["REG"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim     = "rcp"
impl     = "native_recip"
dt       = ["f32"]
space    = ["REG"]
kind     = ["rcp", "rsqrt"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_rcp", expect = [0.25, 0.5] }
