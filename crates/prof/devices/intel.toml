# Intel GPU 档案（P0 只有 L1：见证已写成数据，本机没有 Intel GPU，OpenCL 片段与见证都未执行过）。
# 保留它是为了让"同一份模板、三台设备"在数据上成立，而不是靠口号。
#
# 同一原语可以有多条 `provides`：`dot` 的 `dp4a`（i8×4）与 `fma`（标量 f32）是两种
# 能力，合并成一条会变成少写字段。

[meta]
vendor   = "intel"
id       = "gen12"
emit     = "opencl"
tool     = "clang"
tool_ver = "17.0"
checked  = "2026-11-11"

[fingerprint]
name = "contains: Intel"
arch = "gen12"

[space]
GM   = "global"
FAST = "slm"
REG  = "private"

[mem]
FAST = { bytes = 65536, bank = 16 }
REG  = { bytes = 32768 }

[simt]
group      = 16
groups_max = 32

[peak]
# 96 EU × 8 lane × 2 flop × 1.35 GHz。
# `src` 必须可求值且与 `value` 相等：量纲与含义写在这里，数字只写一次。
flops_f32 = { value = 2.0736e12, src = "96*8*2*1.35e9" }
# LPDDR5 128 bit（16 B）× 4266 MT/s。
bw        = { value = 68.256e9,  src = "16*4266e6" }

[compile]
flags = ["-cl-std=CL2.0"]
preamble = ""

[[provides]]
prim    = "dot"
impl    = "dp4a"
dt      = ["i8", "i32"]
space   = ["REG"]
lanes   = ["4"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_dot_i8", expect = [10.0] }

# P0 模板的 `@dot` 是标量 f32 累加，与上面的整数点积不是同一个指令：单独一条签名。
[[provides]]
prim    = "dot"
impl    = "fma"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "quant"
impl    = "i4_unpack"
dt      = ["i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_quant", expect = [-4.0, 3.5] }

[[provides]]
prim    = "load"
impl    = "vload"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_load", expect = [1.0] }

# `load_async` 的 GM→SLM 是真异步，目标是 GM 时退化为预取 + 普通加载（同 `cpu` 的口径）。
[[provides]]
prim    = "load_async"
impl    = "async_work_group_copy+prefetch"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["2"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_load_async", expect = [1.0] }

[[provides]]
prim    = "commit_wait"
impl    = "work_group_barrier"
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_commit_wait", expect = [0.0] }

[[provides]]
prim    = "store"
impl    = "global_store"
m       = "<=4096"
dt      = ["f32"]
space   = ["GM"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_store", expect = [3.25] }

[[provides]]
prim    = "bar"
impl    = "barrier"
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "convert_float"
dt      = ["f32", "i32", "i8"]
sat     = ["on", "off"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "sub_group_reduce"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L1"
witness = { file = "intel/witness.cl", func = "witness_reduce", expect = [7.5] }

# OpenCL 2.0 的全局原子（`atomic_fetch_add`）。与 `nvidia` / `ascend` 的同一原语对齐：
# 三台设备都声明了它，协商才不必为"哪台有原子"写特例。
[[provides]]
prim    = "atomic"
impl    = "atomic_add"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_atomic", expect = [5.0] }

# ── 闭集的其余六条 ──────────────────────────────────────────────────────────
# gen12 的 Xe 矩阵引擎（`dpas`）、subgroup 交换/广播/扫描与 `native_exp2` /
# `native_recip`。没有片段文本（P0 模板不调用），所以等级是 L0：
# "声明了 + 有见证源码"，不是"本机能跑"。
[[provides]]
prim     = "mma"
impl     = "dpas"
m        = "<=8"
n        = "<=16"
k        = "<=8"
dt       = ["f16", "bf16", "i8"]
space    = ["REG", "FAST"]
accuracy = ["fp32"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

# `sub_group_shuffle` / `sub_group_broadcast`：宽度受 `[simt].group = 16` 约束。
[[provides]]
prim    = "shuffle"
impl    = "sub_group_shuffle"
m       = "<=16"
dt      = ["f32", "i32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_shuffle", expect = [4.0, 3.0, 2.0, 1.0] }

[[provides]]
prim    = "broadcast"
impl    = "sub_group_broadcast"
m       = "<=16"
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_broadcast", expect = [7.0, 7.0, 7.0, 7.0] }

[[provides]]
prim    = "scan"
impl    = "sub_group_scan_inclusive_add"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "intel/witness.cl", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0] }

[[provides]]
prim     = "exp2"
impl     = "native_exp2"
dt       = ["f32"]
space    = ["REG"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim     = "rcp"
impl     = "native_recip"
dt       = ["f32"]
space    = ["REG"]
kind     = ["rcp", "rsqrt"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "intel/witness.cl", func = "witness_rcp", expect = [0.25, 0.5] }
