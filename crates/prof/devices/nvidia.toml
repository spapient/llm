# NVIDIA 档案：T600 / sm75（Turing）真机口径。硬件数字来自 T600 上 nvcc 编译的
# deviceQuery 实测与 nvidia-smi，峰值用可求值 src 表达且与 value 相等，不凭记忆。
#
# 同一原语可以有多条 `provides`，用不同 `impl` 区分互不覆盖的签名：`dot` 的 `dp4a`
# （整数张量核，i8×4）与 `fma`（标量 f32）是两种能力，合成一条就只能靠少写 `dt`/`lanes`
# 来伪装；协商按"能覆盖需求的那条"比对，证据等级只决定它算不算数。

[meta]
vendor   = "nvidia"
id       = "sm75"
emit     = "cuda"
tools    = "nvcc"
tool_ver = "13.3"
checked  = "2026-11-12"

[fingerprint]
cc   = "7.5"
name = "contains: T600"

[space]
GM   = "global"
FAST = "shared"
REG  = "register"

[mem]
FAST = { bytes = 49152, bank = 32 }
REG  = { bytes = 262144 }

[simt]
group      = 32
groups_max = 64

[peak]
# 10 SM × 64 FP32 core/SM × 2（FMA）× 2.1 GHz boost = 2.688 TFLOPS（与 T600 官方 2.7 一致）。
# `src` 必须可求值且与 `value` 相等：量纲与含义写在这里，数字只写一次。
flops_f32 = { value = 2.688e12, src = "10*64*2*2.1e9" }
# 128 bit GDDR6，DDR 计 2 × 5001 MHz：128/8*2*5.001e9 = 160.032 GB/s（与官方 160 一致）。
bw        = { value = 160.032e9, src = "128/8*2*5.001e9" }

[compile]
flags = ["-arch=sm_75", "-O3"]
preamble = """
#include <math.h>
#ifndef __host__
#define __host__
#endif
#ifndef __device__
#define __device__
#endif
__host__ __device__ float _cutile_exp_f32(float x) { return expf(x); }
__host__ __device__ float _cutile_log_f32(float x) { return logf(x); }
__host__ __device__ float _cutile_sum_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += a[i * stride];
    return acc;
}
__host__ __device__ float _cutile_sumsq_f32(const float *a, int n, int stride) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) { float x = a[i * stride]; acc += x * x; }
    return acc;
}
__host__ __device__ float _cutile_max_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = -3.402823466e38f;
    for (int i = 0; i < n; ++i) { float x = a[i * stride]; if (x > acc) acc = x; }
    return acc;
}
__host__ __device__ float _cutile_exp_sum_f32(const float *x, int n, int stride, float max) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += _cutile_exp_f32(x[i * stride] - max);
    return acc;
}
__host__ __device__ void _cutile_exp_norm_f32(float *y, const float *x, int n, int stride, float max, float sum) {
    for (int i = 0; i < n; ++i) y[i * stride] = _cutile_exp_f32(x[i * stride] - max) / sum;
}
__host__ __device__ float _cutile_sqrt_f32(float x) { return sqrtf(x); }
__host__ __device__ float _cutile_sin_f32(float x) { return sinf(x); }
__host__ __device__ float _cutile_cos_f32(float x) { return cosf(x); }
__host__ __device__ float _cutile_pow_f32(float x, float y) { return powf(x, y); }
"""

[[provides]]
prim    = "dot"
impl    = "dp4a"
dt      = ["i8", "i32"]
space   = ["REG"]
lanes   = ["4"]
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_dot_i8", expect = [10.0] }

# P0 模板的 `@dot` 是标量 f32 累加，与上面的整数点积不是同一个指令：单独一条签名。
[[provides]]
prim    = "dot"
impl    = "fma"
dt      = ["f32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "quant"
impl    = "unpack"
dt      = ["i2", "i4", "f32"]
space   = ["REG", "GM"]
group   = ["32"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_quant", expect = [-4.0, 3.5] }

[[provides]]
prim    = "load"
impl    = "ld.global"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_load", expect = [1.0] }

# `load_async` 的 `impl` 记的是正文真正发出来的东西，不是设备会不会那条指令：P0 的 emit 没有
# shared 落点，异步搬运也只能落 shared——所以这条只剩同步加载（intel 例外：`prefetch` 是语言
# 内建，真的发）。`stages` 因此记 1：正文每轮只发一次加载。`pipe<2>`/`pipe<3>` 的级数是调度侧
# 建模，不在能力签名里。
[[provides]]
prim    = "load_async"
impl    = "sync_load"
m       = "<=4096"
dt      = ["i4", "u8", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["1"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_load_async", expect = [1.0] }

# 目录条目：P0 direct/pipe 没有在途异步搬运，commit_wait 无可等 → 只登记 L0（未验证视为不具备）。
[[provides]]
prim    = "commit_wait"
impl    = "noop"
grade   = "L0"
witness = { file = "nvidia/witness.cu", func = "witness_commit_wait", expect = [0.0] }

[[provides]]
prim    = "store"
impl    = "st.global"
m       = "<=4096"
dt      = ["f32"]
space   = ["GM"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_store", expect = [3.25] }

# 目录条目：P0 direct/pipe 没有共享落点，bar 无可挡 → 只登记 L0（未验证视为不具备）。
[[provides]]
prim    = "bar"
impl    = "noop"
grade   = "L0"
witness = { file = "nvidia/witness.cu", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "cvt.rn"
dt      = ["f32", "i32", "i8"]
# 片段层一个原语只有一份正文（`FragmentSet::get`），正文做的是就近舍入、不饱和的转换。
# 登记 `on` 会让只要求 `on` 的算子静默拿到不饱和结果，所以只写真能交付的这一侧。
sat     = ["off"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_cvt", expect = [3.0] }

[[provides]]
prim    = "reduce"
impl    = "shfl.bfly"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
grade   = "L2"
witness = { file = "nvidia/witness.cu", func = "witness_reduce", expect = [7.5] }

[[provides]]
prim    = "atomic"
impl    = "red.global"
dt      = ["f32"]
space   = ["GM"]
op      = ["add", "max"]
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_atomic", expect = [5.0] }

# ── 闭集的其余六条 ──────────────────────────────────────────────────────────
# 档案描述的是**设备**，不只是 P0 的 `gemv_i4`：sm75 有 Turing 张量核（warp 级 `mma.sync`，
# f16→f32）、warp 内交换/广播/前缀扫描，以及 SFU 的 `ex2`/`rcp`。它们没有片段文本
# （P0 模板不调用），所以等级是 L0——"声明了 + 有见证源码"，不是"本机能跑"。
# 注意 sm75 不支持 bf16（sm80+）与 f8（sm89+），故 mma 只声明 f16，不夸大。
[[provides]]
prim     = "mma"
impl     = "mma.sync"
m        = "16"
n        = "8"
k        = "16"
dt       = ["f16"]
space    = ["REG", "FAST"]
accuracy = ["fp32"]
grade    = "L0"
witness  = { file = "nvidia/witness.cu", func = "witness_mma", expect = [1.0, 2.0, 3.0, 4.0] }

# `shfl.idx` / `shfl.idx.bcast`：warp 内按 lane 取数，宽度受 `[simt].group = 32` 约束。
[[provides]]
prim    = "shuffle"
impl    = "shfl.idx"
m       = "<=32"
dt      = ["f32", "i32"]
space   = ["REG"]
lanes   = ["1"]
grade   = "L0"
witness = { file = "nvidia/witness.cu", func = "witness_shuffle", expect = [4.0, 3.0, 2.0, 1.0] }

[[provides]]
prim    = "broadcast"
impl    = "shfl.idx.bcast"
m       = "<=32"
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "nvidia/witness.cu", func = "witness_broadcast", expect = [7.0, 7.0, 7.0, 7.0] }

# `shfl.up` 做含前缀和；`max` 前缀走同一条 lane 序列的另一种运算。
[[provides]]
prim    = "scan"
impl    = "shfl.up"
axis    = ["GMAX"]
op      = ["sum", "max"]
dt      = ["f32"]
space   = ["REG"]
grade   = "L0"
witness = { file = "nvidia/witness.cu", func = "witness_scan", expect = [1.0, 3.0, 6.0, 10.0] }

[[provides]]
prim     = "exp2"
impl     = "ex2.approx"
dt       = ["f32"]
space    = ["REG"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "nvidia/witness.cu", func = "witness_exp2", expect = [8.0, 0.5] }

[[provides]]
prim     = "rcp"
impl     = "rcp.approx"
dt       = ["f32"]
space    = ["REG"]
kind     = ["rcp", "rsqrt"]
accuracy = ["approx"]
grade    = "L0"
witness  = { file = "nvidia/witness.cu", func = "witness_rcp", expect = [0.25, 0.5] }

# ---- 写回尾块（epilogue）的六种形式 ----------------------------------------
# `form` 的取值就是 spec::epilogue 的闭环，六种形式由语法写死，档案只回答"这台设备怎么
# 实现它、证据到哪一级"。片段文本在 `src/epilogue.{ext}`，以 `/* epi: <form> */` 分段；
# 六台设备共用同一份占位符契约（$0 输出 tile，$1 第二操作数，$2 元素数/列数，$3 本步参数）。
# `quant` / `store` 的算术不在别处另写一份：它们复用 `quant.{ext}` 与 `store.{ext}` 的指令级
# 原语，这里的片段只是把该步接进写回顺序。

[[epilogue]]
# 2x2 tile + 列偏置 {10,20}
form    = "bias"
impl    = "column_broadcast"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_bias", expect = [11.0, 22.0, 13.0, 24.0] }

[[epilogue]]
# relu，`$3` 按 ActKind 注入表达式
form    = "act"
impl    = "inject_expr"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_act", expect = [0.0, 0.0, 2.5] }

[[epilogue]]
# 同形逐元素相加
form    = "residual"
impl    = "elementwise_add"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_residual", expect = [1.5, 2.25] }

[[epilogue]]
# 标量缩放
form    = "scale"
impl    = "scalar_mul"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_scale", expect = [0.5, 1.0] }

[[epilogue]]
# scale=1 / bits=4，round 后按位宽钳位
form    = "quant"
impl    = "scale_round_clamp"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_quant", expect = [7.0, -8.0] }

[[epilogue]]
# 写回标记，值原样落缓冲
form    = "store"
impl    = "writeback_marker"
grade   = "L1"
witness = { file = "nvidia/witness.cu", func = "witness_epi_store", expect = [3.25, 1.5] }
