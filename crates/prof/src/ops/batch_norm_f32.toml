# batch_norm_f32：y = gamma*(x-μ)/sqrt(σ²+eps)+beta，μ/σ² 取批统计。
# 归到 elementwise 骨架（声明档几何固定，真窗口/真统计走标量参考），算术在模板里展开。
base = "rmsnorm_f32"

[op]
name     = "batch_norm_f32"
skeleton = "elementwise"
summary  = "y = gamma*(x-μ)/sqrt(σ²+eps)+beta，μ/σ² 取批统计"

[layouts]
x     = "row"
gamma = "row"
beta  = "row"
y     = "row"
