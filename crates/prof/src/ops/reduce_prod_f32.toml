# 连乘归约：y[0] = ∏ a[0..n]。reduce 骨架，与 reduce_sum 同布局/分块/变体，折叠运算为乘。
base = "reduce_sum_f32"

[op]
name     = "reduce_prod_f32"
skeleton = "reduce"
summary  = "y[0] = prod(a[0..n])"

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
reduce = { axis = ["GMAX"], op = ["prod"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
