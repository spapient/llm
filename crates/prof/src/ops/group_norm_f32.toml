# group_norm_f32：y = gamma*(x-μ_g)/sqrt(σ²_g+eps)+beta，统计域是组。
# 归到 elementwise 骨架（声明档几何固定，真窗口/真统计走标量参考），算术在模板里展开。
base = "rmsnorm_f32"

[op]
name     = "group_norm_f32"
skeleton = "elementwise"
summary  = "y = gamma*(x-μ_g)/sqrt(σ²_g+eps)+beta，统计域是组"

[layouts]
x     = "row"
gamma = "row"
beta  = "row"
y     = "row"
