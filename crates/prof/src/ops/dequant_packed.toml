# 低比特打包反量化族：共享布局、网格和 direct 变体，仅码宽与零点不同。

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
q = "row"

[grid]
dims = ["b:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0

[[operators]]
op = { name = "dequant_i2", stem = "dequant_packed", skeleton = "elementwise", summary = "y[n] = scale*(code-2)，输入为打包字节" }
consts = { cpb = 4, width = 2, zero = 2 }

[[operators]]
op = { name = "dequant_i4", stem = "dequant_packed", skeleton = "elementwise", summary = "y[n] = scale*(nibble-8)，输入为打包字节" }
consts = { cpb = 2, width = 4, zero = 8 }
