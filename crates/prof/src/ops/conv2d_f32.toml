# conv2d_f32：y[i,j,co] = bias[co] + Σ_{ki,kj,ci} x[窗口][ci]·weight[(ki·k+kj)·cin+ci][co]，same 补零。
# 归到 elementwise 骨架（声明档固定 4×4 / cin 2 / cout 3 / k3 s1 p1），算术由模板展开、
# 语义与标量参考复用 nn::conv 的 im2col+GEMM 真实现。
base = "silu_f32"

[op]
name     = "conv2d_f32"
skeleton = "elementwise"
summary  = "NHWC y[b,i,j,co] = bias[co] + Σ x[窗口]·weight[K,co]"

[consts]
H = 4
W = 4
CIN = 2
COUT = 3
KH = 3
KW = 3
SH = 1
SW = 1
PH = 1
PW = 1

[layouts]
x      = "row"
weight = "row"
bias   = "row"
y      = "row"
