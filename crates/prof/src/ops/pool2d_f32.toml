# 二维池化族：共享逐元素能力供给与 NHWC 布局；几何常量按职责分别声明。
base = "silu_f32"

[layouts]
x = "row"
y = "row"

[[operators]]
op = { name = "adaptive_pool_f32", stem = "pool2d_f32", skeleton = "elementwise", summary = "NHWC 自适应覆盖窗口平均" }
consts = { MODE = 2, H = 4, W = 4, OH = 2, OW = 2, C = 1, BATCH = 1, KH = 1, KW = 1, SH = 1, SW = 1, PH = 0, PW = 0, INCLUDE_PAD = 0 }

[[operators]]
op = { name = "avg_pool2d_f32", stem = "pool2d_f32", skeleton = "elementwise", summary = "NHWC 二维平均池化，补零默认不计入分母" }
consts = { MODE = 0, H = 4, W = 4, OH = 4, OW = 4, C = 1, BATCH = 1, KH = 3, KW = 3, SH = 1, SW = 1, PH = 1, PW = 1, INCLUDE_PAD = 0 }

[[operators]]
op = { name = "max_pool2d_f32", stem = "pool2d_f32", skeleton = "elementwise", summary = "NHWC 二维最大池化，补零不参与比较" }
consts = { MODE = 1, H = 4, W = 4, OH = 4, OW = 4, C = 1, BATCH = 1, KH = 3, KW = 3, SH = 1, SW = 1, PH = 1, PW = 1, INCLUDE_PAD = 0 }
