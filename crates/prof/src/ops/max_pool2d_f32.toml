# max_pool2d_f32：y[i,j] = max(x[窗口])，补零不入窗口。
# 归到 elementwise 骨架（声明档几何固定，真窗口/真统计走标量参考），算术在模板里展开。
base = "silu_f32"

[op]
name     = "max_pool2d_f32"
stem     = "pool2d_f32"
skeleton = "elementwise"
summary  = "NHWC 二维最大池化，补零不参与比较"

[consts]
MODE = 1
H = 4
W = 4
OH = 4
OW = 4
C = 1
BATCH = 1
KH = 3
KW = 3
SH = 1
SW = 1
PH = 1
PW = 1
INCLUDE_PAD = 0

[layouts]
x = "row"
y = "row"
