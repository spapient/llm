# 对称低比特矩阵乘族：共享二维网格与整数点积 ABI。

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt   = { dt = ["f32", "i32"], sat = ["off"] }

[layouts]
a = "row"
b = "row"

[grid]
dims = ["i:M", "j:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0

[[operators]]
op = { name = "gemm_i8", stem = "gemm_i8", skeleton = "gemm", summary = "Y[m,n] = f32(sum_k i8(A[m,k]) i8(B[k,n]))" }

[[operators]]
op = { name = "gemm_i2", stem = "gemm_packed", skeleton = "gemm", summary = "Y[m,n] = f32(sum_k i2(A[m,k]) i2(B[k,n]))" }
consts = { cpb = 4, width = 2, zero = 2 }

[[operators]]
op = { name = "gemm_i4", stem = "gemm_packed", skeleton = "gemm", summary = "Y[m,n] = f32(sum_k i4(A[m,k]) i4(B[k,n]))" }
consts = { cpb = 2, width = 4, zero = 8 }
