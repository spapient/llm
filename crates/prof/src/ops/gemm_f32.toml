# 矩阵乘：Y[m,n] = sum_k A[m,k]*B[k,n]，收缩轴 K=8。
# OpDecl skeleton="gemm"；CPU 无 MMA 片段，标量三重循环，needs 只有 load/store。

[op]
name     = "gemm_f32"
skeleton = "gemm"
summary  = "Y[m,n] = sum_k A[m,k] B[k,n]"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"
b = "row"

# 网格映射：矩阵乘按输出元素拆线程（二维网格 [M, N]）。`i:M`、`j:N` 表示把模板里的循环
# `for (int i = 0; i < M; ++i)`、`for (int j = 0; j < N; ++j)` 绑定到线程下标，规约维 `p` 循环保留。
[grid]
dims = ["i:M", "j:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
