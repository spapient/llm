# 矩阵乘：Y[m,n] = sum_k A[m,k]*B[k,n]，收缩轴 K=8。
# OpDecl skeleton="gemm"；@mma 走标量 tile（1×1 输出块、k≤8），needs 只有 mma。

[op]
name     = "gemm_f32"
skeleton = "gemm"
summary  = "Y[m,n] = sum_k A[m,k] B[k,n]"

[axes]
N = [32]

[needs]
mma = { m = "<=1", n = "<=1", k = "<=8", dt = ["f32"], space = ["REG"], accuracy = ["fp32"] }

[layouts]
a = "row"
b = "row"

# 网格映射：矩阵乘按输出元素拆线程（二维网格 [M, N]）。`i:M`、`j:N` 表示把模板里的循环
# `for (int i = 0; i < M; ++i)`、`for (int j = 0; j < N; ++j)` 绑定到线程下标，规约维 `p` 循环保留。
[grid]
dims = ["i:M", "j:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 1.0
