# 4 位反量化：打包字节 q（每字节两个 nibble），y = scale*(nibble-8)。
# OpDecl 闭集归到 elementwise；needs 只有 load/store，scale/zero 是标量常量。

[op]
name     = "dequant_i4"
stem     = "dequant_packed"
skeleton = "elementwise"
summary  = "y[n] = scale*(nibble-8)，输入为打包字节"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
q = "row"

# 模板常量：dequant_packed 的打包宽度（i4=每字节 2 码、每码 4 位、零点 8）。
[consts]
cpb   = 2
width = 4
zero  = 8

# 网格映射：每字节一线程（`b:N` 绑定模板里的 `for (int b = 0; b < N; ++b)`，非字节线程由模板内的
# 范围守卫自己返回）。反量化是纯流量算子，一字节一线程正好把 `N/cpb` 次独立读摊到网格上。
[grid]
dims = ["b:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
