# 大 K 对称 int8 矩阵乘：整数点积 i32 累加（dp4a 签名），再 cvt 成 f32，收缩轴 K=4096。

[op]
name     = "matmul_i8"
skeleton = "gemm"
summary  = "Y[m,n] = f32(sum_k i8(A[m,k]) i8(B[k,n])) (K=4096)"

# 与稠密大 K 矩阵乘共用配置文法；具体因子按后端覆盖。
[kernel]
unroll = { default = 4, cpu = 0 }

[axes]
N = [256]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt   = { dt = ["f32", "i32"], sat = ["off"] }

[layouts]
a = "row"
b = "row"

# 网格映射：与 `matmul_f32` 同一路径（输出元素二维网格，K 维循环留在线程内）。
[grid]
dims = ["i:M", "j:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
