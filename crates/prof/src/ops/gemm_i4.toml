# 对称 int4 矩阵乘：打包 nibble 解包后整数点积 i32 累加（mma 整数路径），再 cvt 成 f32，K=8。

[op]
name     = "gemm_i4"
stem     = "gemm_packed"
skeleton = "gemm"
summary  = "Y[m,n] = f32(sum_k i4(A[m,k]) i4(B[k,n]))"

[axes]
N = [32]

[needs]
load  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt   = { dt = ["f32", "i32"], sat = ["off"] }

[layouts]
a = "row"
b = "row"

# 模板常量：gemm_packed 的打包宽度（i4=每字节 2 码、每码 4 位、零点 8）。
[consts]
cpb   = 2
width = 4
zero  = 8

# 网格映射：与 `gemm_f32` / `matmul_f32` 同一降低路径——按输出元素拆线程（二维网格 [M, N]），
# `i:M` / `j:N` 绑定模板里的 `for (int i = 0; i < M; ++i)` 与 `for (int j = 0; j < N; ++j)`，
# 规约维 `p` 保留。打包族此前没声明这一块，于是同一份模板只能串行跑：并行与否不该由
# 声明里「有没有写这四行」决定。`gemm_i2` 继承本文件，一并生效。
[grid]
dims = ["i:M", "j:N"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
