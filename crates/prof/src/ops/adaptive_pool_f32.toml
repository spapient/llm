# adaptive_pool_f32：y[i,j] = 覆盖窗口平均。
# 归到 elementwise 骨架（声明档几何固定，真窗口/真统计走标量参考），算术在模板里展开。
base = "silu_f32"

[op]
name     = "adaptive_pool_f32"
stem     = "pool2d_f32"
skeleton = "elementwise"
summary  = "NHWC 自适应覆盖窗口平均"

[consts]
MODE = 2
H = 4
W = 4
OH = 2
OW = 2
C = 1
BATCH = 1
KH = 1
KW = 1
SH = 1
SW = 1
PH = 0
PW = 0
INCLUDE_PAD = 0

[layouts]
x = "row"
y = "row"
