# P0 算子：weight-only int4 解码 GEMV。
# 选它的理由（cutile README §16）：带宽受限、无布局推导、roofline 好算、三台设备都能跑。

[op]
name     = "gemv_i4"
skeleton = "gemm"
summary  = "y[n] = Σ_g scale[n,g] · dot(dequant(w[n, g·G : g·G+G]), x[g·G : g·G+G])"

# 轴取值（cutile README §4.1）：GMAX 是反量化缓冲 `deq[GMAX]` 的上界，也是 reduce 的轴名。
# 它必须 ≥ 组大小，而组大小由 `needs.quant.group = ["32"]` 固定成 32；更大的取值只多占栈，
# 不改 flops、不改流量。P0 不做 tile 比较（cutile README §9），所以这里只声明实现真正需要的那个值。
[axes]
GMAX = [32]

# 算子级公共需求：能力签名，不是字符串数组。
[needs]
quant  = { dt = ["i4", "f32"], space = ["REG", "GM"], group = ["32"] }
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
load   = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }
cvt    = { dt = ["f32", "i32"], sat = ["off"] }
reduce = { axis = ["GMAX"], op = ["sum"], dt = ["f32"] }
# 模板里出现的搬运原语属于**所有**变体：模板只有一份，`direct` emit 出来同样会调用
# `@load_async`。因此它必须写在算子级需求里，装载期按变体逐条校验。变体级 `extra_needs`
# 只能在此基础上加严，不能少写模板用到的原语。
# 需求里**不写** `stages`：预取级数是调度的建模参数（`schedule = "pipe<2>"`），不是设备能力
# 签名。P0 正文每轮只发一次 `@load_async`，档案据此登记 `stages = ["1"]`；哪台设备的正文真
# 做 2 级预取并在自己档案里登记 `stages = ["2"]`，那时才把这条需求写进 `pipe2.extra_needs`。
load_async  = { bytes = "<=4096", space = ["GM", "FAST"], src = ["GM"], dst = ["GM", "FAST"] }

# 布局契约：槽位 → 闭集构造子。
[layouts]
w = "row"
x = "row"

# 网格映射：Gemm 骨架按输出行拆线程（一维网格）。`n:N` 表示把模板里的循环
# `for (int n = 0; n < N; ++n)` 绑定到线程下标（每线程一行）；gemv_i2 经 `base` 继承同一映射。
[grid]
dims = ["n:N"]

# 模板常量：gemv_packed 的打包宽度（i4=每字节 2 码、每码 4 位、零点 8）。
[consts]
cpb   = 2
width = 4
zero  = 8

# 降级链：order 小者优先。变体只能**加强**需求（`extra_needs`），
# 不能凭空少申请模板里用到的原语——模板由所有变体共享（装载期校验）。
[[variants]]
name      = "pipe2"
order     = 1
schedule  = "pipe<2>"
mma_share = 0.62

[[variants]]
name      = "direct"
order     = 2
schedule  = "direct"
mma_share = 0.35
