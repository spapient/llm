# 逐元素 2^a[n]：exp2 软件接口缺失，按 exp(x·ln2) 复用既有 exp 片段绕开；样本夹具压住上溢边界。
# 一元骨架，与 gelu 同布局/needs/变体，只差右值表达式。
base = "gelu_f32"

[op]
name     = "exp2_f32"
stem     = "unary_fn"
skeleton = "elementwise"
summary  = "y[n] = 2^a[n]"

[consts]
# ln(2)：exp(x·ln2) 等价 2^x，两次舍入误差在 f32 对拍阈值 1e-5 以内。
unexpr = "_cutile_exp_f32(x * 0.6931471805599453f)"
