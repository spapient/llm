# 昇腾档案（P0 只有 L0：形状、执行单元与见证已声明；执行路径已接到 ccec + AscendCL，
# 但那三项编译参数与 AscendC 产物本身都还没在任何 910B 上核对过）。
# 这份档案的用途是证明"设备差异只写在数据里"：三级存储映射到 GM / L1 / L0，
# 执行单元（cube / vector / mte / fixpipe / scalar）以及"某个单元访问得到哪几层存储"
# 全部是本文件里的声明，`cutile` 不认识其中任何一个名字。

[meta]
vendor   = "ascend"
id       = "910b"
emit     = "ascendc"
tools    = "ccec"
checked  = "2026-11-12"

# `kernels/` 只保存真正特化的正文；其余算子复用 CPU 参考实现，避免六份机械副本。
[kernels]
base = "cpu"

[fingerprint]
soc = "contains: ascend910"

[space]
GM   = "GM"
FAST = "L1"
REG  = "L0C"

# 执行单元 → 它能访问的存储层。`provides` 里的 `exec` 只能引用这里声明过的名字；
# 声明的 `space` 必须被该单元访问得到，否则加载期就报错，而不是等真机跑错。
# Cube 是典型例子：矩阵乘在 L1/L0 上做，碰不到 GM，搬运交给 MTE。
[units.cube]
space = ["FAST", "REG"]

[units.vector]
space = ["GM", "FAST", "REG"]

[units.mte]
space = ["GM", "FAST"]

[units.fixpipe]
space = ["GM", "FAST", "REG"]

[units.scalar]
space = ["GM", "FAST", "REG"]

# 容量 / 峰值 / SIMT 三段刻意留空：P0 只声明"能做什么"。
# - `[mem]` / `[peak]` 记的是**实测值**（README §12.1 要求 `src` 可求值且与 `value` 相等），
#   没有真机就不写数字；roofline 因此报"未测量，不参与判定"，而不是拿编出来的峰值算达成率；
# - `[simt]` 不是"还没写"：昇腾的 lane 交换由向量单元（`vgather`/`vbroadcast`）承担，本来就不是
#   SIMT，写 `group = 1` 会把它错报成单 lane 设备（装载期判据只对**写了** `[simt]` 的档案生效）。
# 真机到位后按 README §11.2 回填到 L2/L3。

# 工具链参数与前置声明。`preamble` 是模板 `@reduce` 的 `$func` 与几个软件数学函数在**设备源码**里
# 的定义：缺了它，片段一旦真的调用 `_cutile_sum_f32`（与 cpu/nvidia 同构），汇编出的内核就编不过。
# 内容与 `cpu` 档案同源——P0 片段的语义就是标量 C（`load` 是指针赋值），前置声明
# 跟着片段语言走。语义门（`engine::ascend`）会把这里**每个函数**补上 `__aicore__`（不补就是
# "AI Core 函数调用了宿主函数"，ccec 编译期拒），所以下面的纯算术实现（`_cutile_exp_f32`、四个归约
# 入口）可以直接落设备；`logf` / `sqrtf` / `sinf` / `cosf` / `powf` 那五个仍指向宿主编译器的 libm，
# 是第一次上机时最先会被卡住的地方——把它们换成 `AscendC::Log` / `Sqrt` / `Sin` / `Cos` / `Power`，
# 属于 P3 的 AscendC 特化，与 `DataCopy`/`TPipe`/`Mmad` 同一批。
# `exp` 用位精确的软件实现，其余走 libm（相对误差 <1 ulp，远小于 P0 阈值 1e-5）。
#
# 设备语言与核芯：`-xcce` 让 ccec 把这份翻译单元按 AscendC 编（不带它，`__aicore__` /
# `AscendC::GetBlockIdx()` 在宿主 C++ 里就是未定义标识符）；`--cce-aicore-algorithm=dav-c220` 是
# `id = "910b"` 那一档的核芯名；`-lascendcl` 是 host 侧发射 / 显存管理的运行库（单源 `<<<>>>`
# 流程也要连它）。本机没有 ccec，这三项拼写取自 CANN 的编译文档、未经真机核对：第一次上机
# 若报"未知架构"，先核对 `--cce-aicore-algorithm` 的取值再改档案，别在数据里留第二个猜测。
[compile]
flags = ["-xcce", "--cce-aicore-arch=dav-c220", "-O2", "-lascendcl"]
preamble = """
#include <math.h>
#include <stdint.h>
static const float _cutile_exp_log2e  = 1.4426950408889634f;
static const float _cutile_exp_ln2_hi = 0.693145751953125f;
static const float _cutile_exp_ln2_lo = 1.4286067653301870e-6f;

static inline float _cutile_exp_f32(float t) {
    if (t < -87.330f) return 0.0f;
    float z = t * _cutile_exp_log2e;
    int k = (int)z;
    if (z >= 0.0f) { if (z - (float)k >= 0.5f) k += 1; } else if ((float)k - z > 0.5f) { k -= 1; }
    if (k < -126) return 0.0f;
    if (k >= 128) { union { uint32_t u; float f; } inf; inf.u = 0x7F800000u; return inf.f; }
    float kr = (float)k;
    float r = t - kr * _cutile_exp_ln2_hi - kr * _cutile_exp_ln2_lo;
    float p = 1.0f + r * (1.0f + r * (0.5f + r * (1.0f/6.0f + r * (1.0f/24.0f + r * (1.0f/120.0f)))));
    union { uint32_t u; float f; } twop;
    twop.u = (uint32_t)(127 + k) << 23;
    return p * twop.f;
}

static inline float _cutile_log_f32(float x) { return logf(x); }
static inline float _cutile_sqrt_f32(float x) { return sqrtf(x); }
static inline float _cutile_sin_f32(float x) { return sinf(x); }
static inline float _cutile_cos_f32(float x) { return cosf(x); }
static inline float _cutile_pow_f32(float x, float y) { return powf(x, y); }
static inline float _cutile_ceil_f32(float x) { return ceilf(x); }
static inline float _cutile_floor_f32(float x) { return floorf(x); }
static inline float _cutile_round_f32(float x) { return roundf(x); }
static inline float _cutile_trunc_f32(float x) { return truncf(x); }

/* 归约统一入口 (a, n, stride)：n==1 走标量快通道，n>1 按步长数组归约。 */
static inline float _cutile_sum_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += a[i * stride];
    return acc;
}

static inline float _cutile_max_f32(const float *a, int n, int stride) {
    if (n == 1) return a[0];
    float acc = -3.402823466e38f;
    for (int i = 0; i < n; ++i) { const float x = a[i * stride]; if (x > acc) acc = x; }
    return acc;
}

static inline float _cutile_exp_sum_f32(const float *x, int n, int stride, float max) {
    float acc = 0.0f;
    for (int i = 0; i < n; ++i) acc += _cutile_exp_f32(x[i * stride] - max);
    return acc;
}

static inline void _cutile_exp_norm_f32(float *y, const float *x, int n, int stride, float max, float sum) {
    for (int i = 0; i < n; ++i) y[i * stride] = _cutile_exp_f32(x[i * stride] - max) / sum;
}
"""

[[provides]]
prim    = "quant"
impl    = "vcvt_pack"
dt      = ["i4", "f32"]
space   = ["FAST", "REG"]
group   = ["32"]
exec    = ["vector"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_quant_vcvt_pack", expect = [-4.0, 3.5] }

[[provides]]
prim    = "dot"
impl    = "mmad"
dt      = ["f16", "bf16"]
space   = ["FAST", "REG"]
lanes   = ["16"]
exec    = ["cube"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_dot_f16", expect = [70.0] }

[[provides]]
prim     = "load"
impl     = "copy_gm_to_l1"
m        = "<=65536"
dt       = ["i4", "u8", "f16", "f32"]
space    = ["GM", "FAST"]
src      = ["GM"]
dst      = ["FAST"]
exec     = ["mte"]
grade    = "L0"
witness  = { file = "ascend/witness.cpp", func = "witness_load_copy_gm_to_l1", expect = [1.0] }

# 目录条目：昇腾的 MTE 两级搬运有见证、**没有片段正文**，所以只能是 `L0`（未验证视为不具备）。
# 保留它是为了让"本档案只登记 1 级"有对照；真要启用，得先补正文再升到 `L2`——
# `every_verified_provide_has_a_fragment_body` 会拦住只有等级、没有正文的写法。
[[provides]]
prim     = "load_async"
impl     = "copy_gm_to_l1_async"
m        = "<=65536"
dt       = ["i4", "u8", "f16", "f32"]
space    = ["GM", "FAST"]
src      = ["GM"]
dst      = ["FAST"]
stages   = ["2"]
exec     = ["mte"]
grade    = "L0"
witness  = { file = "ascend/witness.cpp", func = "witness_load_async_copy_gm_to_l1", expect = [1.0] }

# 目录条目：P0 direct/pipe 没有在途异步搬运，commit_wait 无可等 → 只登记 L0（未验证视为不具备）。
[[provides]]
prim    = "commit_wait"
impl    = "noop"
exec    = ["mte"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_commit_wait", expect = [0.0] }

