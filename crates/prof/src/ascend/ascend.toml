space   = ["GM"]
op      = ["add", "max"]
exec    = ["vector"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_atomic", expect = [5.0] }

# ── P0 的标量路径 ────────────────────────────────────────────────────────────
# 上面十条描述的是 tile 算子的落点（Cube 做 f16 GEMM、MTE 只到 L1、FixPipe 出 L1/L0C）。
# P0 模板是标量 C 语义，跑在 scalar 单元上：它三层存储都访问得到，所以"目标可以是 GM"、
# "deq 可以落在 GM" 这类需求由**另一条签名**满足，而不是把特化那条的 `space`/`dst` 改宽。
# 两条签名都留在 L0：没有真机证据，协商一律当作不具备。
[[provides]]
prim    = "quant"
impl    = "scalar_dequant"
dt      = ["i2", "i4", "f32"]
space   = ["GM", "FAST", "REG"]
group   = ["32"]
exec    = ["scalar"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_quant_scalar_dequant", expect = [-4.0, 3.5] }

# scalar 单元上同样分四路：`fma` 单次舍入、四链互不相欠，正文与 `intel`/`metal`/`nvidia`/`musa`
# 的 `dot/fma4` 逐字同源。Cube 的 `mmad`（f16 分块、`lanes = 16`）是另一条签名，见上。
[[provides]]
prim    = "dot"
impl    = "fma4"
dt      = ["f32"]
space   = ["GM", "FAST", "REG"]
lanes   = ["1"]
exec    = ["scalar"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_dot", expect = [70.0] }

[[provides]]
prim    = "load"
impl    = "scalar_copy"
m       = "<=65536"
dt      = ["i4", "u8", "f16", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM"]
exec    = ["scalar"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_load_scalar_copy", expect = [1.0] }

# `load_async` 的 `impl` 记的是正文真正发出来的东西，不是设备会不会那条指令：P0 的 emit 没有
# shared 落点，异步搬运也只能落 shared——所以这条只剩同步加载（intel 例外：`prefetch` 是语言
# 内建，真的发）。`stages` 因此记 1：正文每轮只发一次加载。`pipe<2>`/`pipe<3>` 的级数是调度侧
# 建模，不在能力签名里。
[[provides]]
prim    = "load_async"
impl    = "sync_load"
m       = "<=65536"
dt      = ["i4", "u8", "f16", "f32"]
space   = ["GM", "FAST"]
src     = ["GM"]
dst     = ["GM", "FAST"]
stages  = ["1"]
exec    = ["scalar"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_load_async_scalar_stage", expect = [1.0] }

# ── 闭集的其余六条 ──────────────────────────────────────────────────────────
# 上面十四条是"P0 模板怎么跑"，这六条是"910b 还有什么"：Cube 的 tile 乘加、vector 的
# 置换/广播/前缀和与 `vexp`/`vrec`。没有片段文本（P0 模板不调用），等级因此停在 L0；
# 声明它们的原因是不让"档案声称的算力"与"档案声明的能力"对不上。
