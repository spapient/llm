space   = ["REG", "GM"]
exec    = ["fixpipe"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_store", expect = [3.25] }

# 目录条目：P0 direct/pipe 没有共享落点，bar 无可挡 → 只登记 L0（未验证视为不具备）。
[[provides]]
prim    = "bar"
impl    = "noop"
exec    = ["scalar"]
grade   = "L0"
witness = { file = "ascend/witness.cpp", func = "witness_bar", expect = [0.0] }

[[provides]]
prim    = "cvt"
impl    = "vcvt"
dt      = ["f16", "f32", "i32"]
# 片段层一个原语只有一份正文（`FragmentSet::get`），正文做的是就近舍入、不饱和的转换。
# 登记 `on` 会让只要求 `on` 的算子静默拿到不饱和结果，所以只写真能交付的这一侧。
sat     = ["off"]
exec    = ["vector"]
grade   = "L0"
