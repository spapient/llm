[package]
name = "cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NVIDIA CUDA GPU execution backend for the LLM runtime (Linux only)"

[lib]
name = "cuda"

[dependencies]
thiserror.workspace = true
lib = { path = "../lib" }
tensor = { path = "../tensor" }
api = { path = "../api" }

# The CUDA bindings are only pulled in on Linux. Every other target compiles
# this crate as an empty library so that `cargo check --workspace --all-targets`
# stays green on any host (see docs/design.md 第 21 章).
#
# `dynamic-loading` lets `cargo check` type-check without a CUDA toolkit, and
# `cuda-12060` is mandatory: without an explicit `cuda-<version>` feature
# cudarc's build script aborts (verified, evidence E1).
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { workspace = true, features = [
    "driver",
    "cublas",
    "cudnn",
    "nvrtc",
    "dynamic-loading",
    "cuda-12060",
] }

[lints]
workspace = true
