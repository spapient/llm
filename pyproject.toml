[tool.ruff]
target-version = "py312"
required-version = "==0.17.6"
line-length = 100
src = ["validation"]
force-exclude = true
extend-exclude = [".tmp", "target"]

[tool.ruff.lint]
# 缺陷、现代化、导入、性能、路径与 Ruff 特有规则。
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PERF", "PTH", "RUF"]
# 仅排除与仓库语境不匹配的规则：诊断长文本由 formatter 排版，中文全角标点属于正式文案。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["llm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
