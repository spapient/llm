# 全仓拼写门：只排除生成物；领域词必须逐项登记，禁止整目录源码豁免。
[files]
extend-exclude = [
  "target*/",
  ".tmp/",
  "validation/**/*.log",
  "validation/**/*.json",
]

[default]
# 保留默认 locale：英美拼写变体都可接受，不把 Behaviour/Judgement 等合法词误判为缺陷。
# 只忽略两条手工编码测试的精确字面量，不接受普通英文近似拼写。
extend-ignore-re = ['"ba"', '"abd"']

[default.extend-words]
# Arm Scalable Matrix Extension。
SME = "SME"
sme = "sme"
# 昇腾 CANN、Apple Neural Engine、NCE 等后端名称。
CANN = "CANN"
Cann = "Cann"
ANE = "ANE"
Ane = "Ane"
ane = "ane"
Nce = "Nce"
# 论文、公式及算子的固定名称或记号。
SLQ = "SLQ"
Thm = "Thm"
nd = "nd"
iy = "iy"
arange = "arange"

[default.extend-identifiers]
# 领域标识符：MoBA、OpenCL NDRange、输出梯度 dOut、erf 多项式级数。
MoBA = "MoBA"
clEnqueueNDRangeKernel = "clEnqueueNDRangeKernel"
dout = "dout"
ser = "ser"
