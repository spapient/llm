[package]
name = "llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An LLM runtime written in Rust."
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spapient/llm"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unused_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
