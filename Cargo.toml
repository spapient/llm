[lints]
workspace = true
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
publish = false
[workspace.dependencies]
# 序列化：由确实需要序列化的 crate 显式引入。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误建模：优先使用 Result 和明确的错误类型。
thiserror = "2"
# 日志与诊断：由需要日志能力的 crate 显式引入。
tracing = "0.1"
# CLI 和服务端依赖按需使用。
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
] }
# 质量保障依赖仅在对应 crate 的开发依赖中引入。
proptest = "1"
criterion = "0.7"
# 参数化测试：以 `#[case]` 表驱动表达"仅输入不同、断言形状相同"的用例，
# 保留每个用例的独立名字与独立失败（见 docs/engineering.md 测试依赖决策）。
rstest = "0.27"
# 平台 GPU 绑定：仅由对应平台的 Layer 1 后端 crate 在目标平台条件下引入
# （见 docs/design.md 第 21 章）。任何非目标平台都不会构建它们。
objc2 = "0.6"
objc2-metal = "0.3"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
cudarc = "0.19"
# 密码学哈希：.u 格式的块内容身份与根锚点（BLAKE3-128/256）。
blake3 = "1"
# 分块无损压缩：.u 格式的默认编解码（纯 Rust、无 unsafe、极速解压）。
lz4_flex = "0.11"
# 分块无损压缩第二编解码：更高压缩率的 Zstd（C 绑定，参照 GGUF 生态）。
zstd = "0.13"
# 半精度浮点元素类型（f16/bf16）：LLM 权重的现实存储 dtype。
half = { version = "2", features = ["bytemuck"] }
# 安全的字节↔类型重解释；unsafe 封装在依赖内部，workspace 保持零 unsafe。
bytemuck = "1"
# Ed25519 签名：对 .u 根哈希签名，纯 Rust、无 unsafe。
ed25519-compact = "2"
# AES-256-GCM 认证加密：.u 快照分块加密（纯 Rust，硬件加速 unsafe 封装在依赖内）。
aes-gcm = "0.10"
# 内存映射文件读取：.u 快照 mmap 零拷贝（unsafe 封装在依赖内，safe API）。
mmap-guard = "0.2"
# 预分词 Split 段的正则切分（llama3/qwen3/deepseek 等），需 look-around。
fancy-regex = "0.15"
# normalizer 段的 Unicode 归一化（NFC/NFD/NFKC/NFKD，qwen3 需要 NFC）。
unicode-normalization = "0.1"
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
# M4 declaration: strict no-separator naming (all-lowercase concatenated type,
# trait, enum, and variant identifiers) requires relaxing the Rust naming
# conventions. Scope is limited to Layer 0 identifier style; it does not relax
# unsafe_code, unwrap_used, expect_used, panic, todo, or unimplemented.
non_camel_case_types = "allow"
non_snake_case = "allow"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
[profile.dev]
debug = 1
[profile.test]
debug = 1
[profile.release]
debug = 1
lto = "thin"
codegen-units = 1