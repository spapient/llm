# 纯 workspace 根：不再持有 package、二进制或依赖。
# 组合根与两个二进制（`llm` / `cutile`）都在 `crates/cli`；工作区成员见下方 `members`。

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spapient/llm"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unused_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
# 版本分叉只发生在第三方宏 crate 的 dev 图上：criterion 链里 serde_derive 转 syn 3、
# half 链里 zerocopy-derive 转 syn 2。本仓清单收敛不到，故按需放行这一条。
multiple_crate_versions = "allow"
todo = "deny"
unimplemented = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# 工作区共享的第三方依赖版本：各 crate 用 `{ workspace = true }` 引用，避免版本漂移。
[workspace.dependencies]
criterion = "0.8.2"
half = "2.7.1"
num-traits = "0.2.19"
proc-macro2 = "1.0"
proptest = "1.12.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
toml = "1.2.1"
