[package]
name = "cutile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Device-agnostic kernel DSL: capability negotiation, fragment assembly, emit, and the doctor/verify/bench reports computed on top of it."
readme = "README.md"
publish = false
# tests/ 下是经 src 模块 #[path] 挂回的白盒单测，不作为独立集成测试目标自动编译。
autotests = false

[dependencies]
annotation = { path = "../annotation", package = "llm-annotation" }
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }
# 档案、声明层与写回尾块的文法（`bias; act:relu; store` 的解析结果）都在 `prof`。
prof = { path = "../prof", package = "llm-prof" }

[features]
# 把设备镜像的开关透传下去：`cutile` 是消费片段层的机制层，发布时它才是用镜像的那一段。
device-image = ["prof/device-image"]

[dev-dependencies]
# 参考口径与注册表在本 crate（`nn` 的 dev 测试又用本 crate 的装配器，环只存在于 dev 层）。
nn = { path = "../nn", package = "llm-nn" }
testkit = { path = "../testkit", package = "llm-testkit" }

[lints]
workspace = true
