# Flash 注意力：online softmax 分块，单遍 K/V，不落地完整分数矩阵。
# OpDecl 闭集没有专用骨架，归到 elementwise；needs 只有 load/store（数学走标量函数）。

[op]
name     = "flash_attention_f32"
skeleton = "elementwise"
summary  = "O = online-softmax(QK^T/sqrt(d)) V"

[axes]
N = [8]

[consts]
# 单查询行的本地累加容量；大于此头宽时逐 D 块重算分数，不越界、不变 VLA。
D_BLOCK = "64"

[needs]
dot    = { dt = ["f32"], space = ["REG"], lanes = ["1"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
q = "row"
k = "row"
v = "row"
y = "row"

# 网格映射：按查询行拆线程（一维网格）。`i:S` 把模板里的循环
# `for (int i = 0; i < S; ++i)` 绑定到线程下标（每线程一行）；online softmax 留在每线程串行。
[grid]
dims = ["i:S"]

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
