# 一元逐元素函数族：公共布局、能力供给与 direct 变体继承自 gelu_f32。
# 每条只声明自己的职责名与右值表达式；abs 的精度分档仍独立维护。
base = "gelu_f32"

[[operators]]
op = { name = "ceil_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = ceil(a[n])" }
consts = { unexpr = "_cutile_ceil_f32(x)" }

[[operators]]
op = { name = "cos_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = cos(a[n])" }
consts = { unexpr = "_cutile_cos_f32(x)" }

[[operators]]
op = { name = "exp2_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = 2^a[n]" }
consts = { unexpr = "_cutile_exp_f32(x * 0.6931471805599453f)" }

[[operators]]
op = { name = "floor_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = floor(a[n])" }
consts = { unexpr = "_cutile_floor_f32(x)" }

[[operators]]
op = { name = "log1p_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = ln(1 + a[n])" }
consts = { unexpr = "_cutile_log_f32(1.0f + x)" }

[[operators]]
op = { name = "neg_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = -a[n]" }
consts = { unexpr = "-x" }

[[operators]]
op = { name = "recip_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = 1 / a[n]" }
consts = { unexpr = "1.0f / x" }

[[operators]]
op = { name = "round_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = round(a[n])" }
consts = { unexpr = "_cutile_round_f32(x)" }

[[operators]]
op = { name = "rsqrt_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = 1/sqrt(a[n])" }
consts = { unexpr = "(1.0f / _cutile_sqrt_f32(x))" }

[[operators]]
op = { name = "sign_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = sign(a[n])" }
consts = { unexpr = "x > 0.0f ? 1.0f : x < 0.0f ? -1.0f : 0.0f" }

[[operators]]
op = { name = "sin_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = sin(a[n])" }
consts = { unexpr = "_cutile_sin_f32(x)" }

[[operators]]
op = { name = "sqrt_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = sqrt(a[n])" }
consts = { unexpr = "_cutile_sqrt_f32(x)" }

[[operators]]
op = { name = "square_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = a[n] * a[n]" }
consts = { unexpr = "x * x" }

[[operators]]
op = { name = "trunc_f32", stem = "unary_fn", skeleton = "elementwise", summary = "y[n] = trunc(a[n])" }
consts = { unexpr = "_cutile_trunc_f32(x)" }
