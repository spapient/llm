# 求和归约：y[0] = sum(a[0..n])。
# reduce 骨架：输入轴 n 被规约，输出单元素；needs 为 reduce/store。

[op]
name     = "reduce_sum_f32"
skeleton = "reduce"
summary  = "y[0] = sum(a[0..n])"

[axes]
N = [32]

[needs]
reduce = { axis = ["GMAX"], op = ["sum"], dt = ["f32"] }
store  = { bytes = "<=4096", dt = ["f32"], space = ["GM"] }

[layouts]
a = "row"

# 分块归约：长轴 N 切成 256 元素一块，网格 = ceil(N/256)，每线程归约一块写部分和 y[g]，主机折叠。
[chunk]
# 32 而不是 256：网格 = ceil(N/32)，小 N 下也够占满 SM；部分和更细，主机折叠 O(G) 只是加法。
size = 32

[[variants]]
name      = "direct"
order     = 1
schedule  = "direct"
mma_share = 0.0
