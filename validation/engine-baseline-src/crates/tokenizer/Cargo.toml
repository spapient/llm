[package]
name = "llm-tokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Text/token boundary: the Tokenizer trait and a byte-level reference implementation."
publish = false
autotests = false

[dependencies]
diagnostic = { path = "../diagnostic", package = "llm-diagnostic" }

[dev-dependencies]
testkit = { path = "../testkit", package = "llm-testkit" }
proptest = { workspace = true }

[lints]
workspace = true

[[test]]
name = "tokens"
path = "tests/tokens.rs"

[[test]]
name = "prop_tokenizer"
path = "tests/prop_tokenizer.rs"
