name: Quality tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macro-spelling-workflow:
    name: macro expansion + typos + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      # typos 使用预发布清单；cargo-expand 经 Cargo 回退安装，两个版本都显式固定。
      - name: Install expansion and spelling tools
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.52.2,cargo-expand@1.0.127
          fallback: cargo-install

      # 展开文本用于审查宏/注解覆盖，不作为独立编译或运行证明。
      - name: Expand annotation and train targets
        run: |
          mkdir -p target/expanded
          cargo expand -p llm-annotation --lib --all-features --locked > target/expanded/annotation.rs
          cargo expand -p llm-train --lib --tests --all-features --locked > target/expanded/train.rs
          test -s target/expanded/annotation.rs
          test -s target/expanded/train.rs

      - name: Check spelling
        run: typos --sort

      # 官方发布脚本；版本固定，避免随 latest 漂移。
      - name: Install actionlint
        shell: bash
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: Check all workflows
        shell: bash
        run: ./actionlint -color

      - name: Upload expanded sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-sources
          path: target/expanded/
          retention-days: 14
          if-no-files-found: ignore

  complexity:
    name: Lizard + rust-code-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install rust-code-analysis
        run: cargo install --locked rust-code-analysis-cli@0.0.25
      - name: Generate independent complexity reports
        run: bash scripts/complexity.sh
      - name: Upload complexity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-reports
          path: target/complexity/
          retention-days: 14
          if-no-files-found: ignore

  miri:
    name: Miri (pure computation core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
          components: miri
      - uses: Swatinem/rust-cache@v2
      # 文件同步等宿主能力不属于 Miri 支持范围；这里运行明确的纯计算模块集。
      - name: Run storage core under Miri
        run: bash scripts/miri.sh
