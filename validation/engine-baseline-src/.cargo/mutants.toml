# cargo-mutants 配置（手动 / 可选变异测试，不进 CI 阻断门）。
# 用法见 scripts/mutants.sh；安装：cargo install --locked cargo-mutants。
#
# 定位（决策见 docs/adr/0057 §8）：变异测试对每个变异体编译并跑一遍测试，耗时远超普通 CI，
# 因此只在需要评估「测试是否真能抓住 bug」时按需手动跑，不合并进 PR 阻断门禁。

# 与主测试运行器一致走 nextest（并行隔离）。
test_tool = "nextest"

# 只审视生产源码；测试、fuzz harness、基准、共享夹具不做变异对象。
examine_globs = [
    "crates/*/src/**/*.rs",
]
exclude_globs = [
    "crates/*/tests/**/*.rs",
    "crates/fuzz/src/**/*.rs",
    "crates/benchmarks/src/**/*.rs",
    "crates/testkit/src/**/*.rs",
]

# 这些调用本身不是可被有意义变异的逻辑，跳过生成变异体。
skip_calls = [
    "panic!",
    "unreachable!",
    "todo!",
    "unimplemented!",
    "println!",
    "eprintln!",
]
skip_calls_defaults = true

# 变异体可能触发新的 warning；给 rustc 盖一层 cap-lints，避免告警把编译失败误判成测试杀死。
cap_lints = true

# 按默认特征跑变异测试：设备 / 后端分支在无 Metal/CUDA 环境本就跳过，不开 all-features。
all_features = false

# 超时相对基线放大；给无卡环境下的编译留出余量。
timeout_multiplier = 2.0
minimum_test_timeout = 60.0

# 变异体受其所在包自己的测试约束（workspace 内逐包判定）。
test_workspace = true

# dev profile 编译更快，变异轮次多，不跑 release LTO。
profile = "dev"
