# 词汇表契约的门禁配置（`docs/ARCHITECTURE.md` 第三节「闭集与位集」）。
#
# 消费方：`crates/tools/build.rs` 在**构建期**用 `toml` 把本文件展开成 `Table` 字面量，运行期由
# `tools::vocabulary()` 读取（ADR 0022）；`tests/contracts.rs`、`tests/architecture.rs` 与
# `crates/tools` 的门禁共用这棵树，不再各自解析文本。
#
# dylint 规则（HIR 版，`ui-toml` 配置指向本文件）是**计划中的**下一个消费方，用于在 IDE 里即时
# 提示同一条契约；它尚未落地，所以本文件的任何改动都以 `cargo test --test contracts` 为准，
# 不要假设有另一处也在读它。
#
# 白名单按 crate 列，并强制带理由：一份没有理由的豁免等于把规则删掉一半。

[closed]
# 允许手写闭集表（`pub const ALL: [Self; N]`）的 crate。
#
# 规则：`prof` 下游的成员必须用 `impl Closed for ..` 把名字表写成切片，`ALL`/`as_str`/`parse`
# 由 `prof::inherent_names!` 统一转发；只有**够不到 `Closed`** 的层（`llm-prof` 是 L2 基座，
# 反向依赖会在层内成环）才允许把词汇表留在本地。

[[closed.exempt]]
crate = "diagnostic"
reason = "L1：错误类别是错误类型的词汇表，反向依赖 L2 的 prof 会成环"

[[closed.exempt]]
crate = "shard"
reason = "L1：分片种类（张量流水线/数据）是调度层的词汇表"

[[closed.exempt]]
crate = "nn"
reason = "L5：`Cell::ALL`（三种循环单元）与 `RecurrentTensor::ALL`（四件权重）是带领域方法（`gates`/`of_gates`/`activations`/`suffix`）的语义枚举的遍历助表，不是 `prof` 的名字原子表；转 `Closed` 会凭空加 `nn → prof` 依赖，并把 `Ord`/`Hash`/`as_str` 硬套到领域枚举上"


[bitset]
exempt = []

# 手写位集（`struct FooSet(u32)`）的允许清单。
#
# 规则：位集只有 `prof::atom::Set<E, WORDS>` 一份实现（`WORDS` 是 const 参数，容量在编译期
# 自证）。本清单为空是有意的——空清单本身是判据，不是"还没填"。

# 注解文法的闭集（`crates/annotation/src/syntax.rs` 的 `DTYPES`）没有豁免节：
#
# 规则：注解里的名字必须是词汇表的**投影**——`DTYPES` 与「`cutile::reference::tolerance`
# 给出非零阈值」的 `DType` 集合逐项相等，且用变体名核对 `codegen` 的机械映射。这是等式，
# 不是"尽量"：少一个名字就有一种输出永远无法被声明，多一个就拼出匹配不上的代码。
#
# 语义表与注册表的镜像（`#[model]` 标了必须注册、注册的 `model:` 必须是 `..::MODEL`）同样没有
# 豁免节：两条规则互为反面，出现例外说明契约该改，而不是某个 crate 该豁免。
# 门禁：`tests/contracts.rs::{annotation_names_come_from_the_vocabulary,
# the_registry_and_the_model_annotations_are_mirrors}`，以及 `#[model]` 在每个
# 调用点生成的 `DType::parse(..)` / `output_type()` 断言。

[ownership]
# 反向所有权校验的存量基线（`tests/architecture.rs::every_public_type_is_listed_or_baselined`）。
#
# 规则：每个成员 `crates/<member>/src` 里的 `pub struct|enum|trait` 必须出现在
# `docs/ARCHITECTURE.md` 第三节的所有权表，或登记在这里。
#
# 与 `[closed]` 白名单、`[[gate.debt]]` 同一套路：**存量冻结，新增必进表**。基线不允许过期——
# 某个名字后来进了表，或不再是 `pub`（删掉/改成私有），对应条目必须删除，否则测试失败。
# 每条都必须带理由：一份没有理由的豁免等于把规则删掉一半。
#
[[ownership.unlisted]]
