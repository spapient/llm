# `[[gate.debt]]` 存量棘轮：只登记入口编排层（`crates/cli/src/`）的既有超标。登记表是实测快照：
# 登记值必须等于实测值，改善后必须删掉对应度量条目（`Gate::stale`），恶化必失败。运行时生产代码
# （`crates/*/src` 的训练/推理路径，除 cli 入口外）没有债务条目：超限即新增，直接失败，按主题拆模块收口。
#
# 当前无债务条目：`cutile` 子命令派发按主题拆成流水线 / 台账两个分派，各三臂，圈复杂度均在阈值内。
