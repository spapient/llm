names = ["CutileCommand"]
reason = "CLI 子命令解析出的命令枚举（table/doctor/verify/bench/ledger/fusions/cache 等分支结果），只由 `main.rs` 经 `llm_cli::kernel` 路径消费；lib 层对外契约是 `argv::Command`/`Invocation`，枚举本体属 bin 入口件，不进所有权表"

[[ownership.unlisted]]
crate = "cutile"
names = ["CallArg", "ChainStep", "FragmentGap", "NeedReport", "PrimCall", "Unlock"]
reason = "内核 DSL 的协商前端与结果类型；`UnaryFn` 是一元数学算子（Abs/Sqrt/Exp/Ln/Trig/取整）发射名与主机求值闭集；按 `crates/cutile/README.md` 的分节归类，待分节稳定后逐节进表（执行期五个名字随拆分迁到 `optim`）"

[[ownership.unlisted]]
crate = "dtype"
names = ["BlockFormat", "ElementSpec", "Family", "MxTypeSpec", "QTypeSpec", "UnknownCode", "UnknownName"]
reason = "行表类型、分类闭集与解析错误；表形状仍在演进，按闭集整体进表比逐项更清楚"

[[ownership.unlisted]]
crate = "engine"
names = ["LocalExecutor"]
reason = "`LocalExecutor` 是 `Executor` 基座的只记账同步 CPU 实现（提交入队、按流排水，持注入分配器），未接真机后端；作为本地/测试后端保留在门面后，对外契约以 `Executor` 缝为准，故不进所有权表"

[[ownership.unlisted]]
crate = "fuzz"
names = ["Behaviour", "Cli", "Crc", "CutileNegotiate", "Dist", "HttpHead", "LebRoundtrip", "Lex", "Repro", "Seed", "ServeFrames", "Target", "TrainSnapshot", "WeightsArchive", "WeightsJson", "WeightsSafetensors", "WireLeb", "WireSealed"]
reason = "模糊测试的驱动侧适配与目标件：每个 `Target` 实现对应一个 harness 入口（命令行 / 词法 / 权重 JSON·safetensors·自有容器 / 训练快照 / 帧解码 / HTTP 头 / LEB 游标·往返 / 线格式密封 / CRC 分块对拍 / 分布、形状与协商不变量），加上目标、种子、行为描述与复现样本；工具成员，不参与运行时分层"

[[ownership.unlisted]]
crate = "prof"
names = ["Access", "Constant", "Formula", "Mem", "Meta", "Param", "ProfileError", "Recipe", "Simt", "SplitMix64", "Unit", "Witness"]
reason = "档案行表的列类型与匹配规则（公开面是 `Archive`/`Profile`），加上随 `op`/`prim` 解散迁来的声明解析结果（骨架 / 网格映射 / 轴候选 / tile 组合 / 变体闭集）与内嵌片段条目 `Builtin`；`spec` 并入本 crate 后又多了契约词汇的内部类型（访问模式、算子参数、轴角色与轴规格、C 类型、公式缓存句柄、形状上下文、计数器型随机）。`Axis` 在声明层与 `einsum` 各有一份，同名不同物：表里只登记声明层那一份，本基线不再重复；`AttrKey`/`Grade`/`Prim`/`Space` 由 `vocabulary!` / `closed_enum!` 宏生成、扫描器认不出定义行，故四者不再登记"

[[ownership.unlisted]]
crate = "train"
names = ["Running"]
reason = "`Running` 是 BatchNorm 滚动统计值类型（每通道均值/方差），随 `Geometry::Norm` 前向读写搬运。公开训练面是 `Session`/`TrainConfig`"

[[ownership.unlisted]]
crate = "tools"
names = ["Call", "Direction", "Link", "Mount", "Over"]
reason = "复杂度与回归门禁的行类型，以及 `Mount`（`mod 名字;` 的模块名与显式 `#[path]` 相对路径描述，供剔除测试条目时判定挂载归属）；工具成员，公开面是 `Report`"

[[ownership.unlisted]]
crate = "weights"
names = ["Pick", "Sha256", "Svd", "Tensor"]
reason = "选码结果与哈希内部件：五轴选码结果（`axes` 的 `Pick`）、`svd` 分解件与哈希内部件；`Axis` 已随 `AxisSet` 成为写端裁剪配置并进入所有权表；谱隙证书的 `Certified`/`Note`/`Stable`/`Mode`/`EpsMethod`/`Bound` 已进所有权表（它们决定秩，是可读的判定口径而不是实现细节），公开生产面是表里的读写契约与容器类型。外部格式的解析件随 `formats` 并入本 crate：`Gguf` 是 GGUF 头部 + 数据区视图，`Tensor` 是 GGUF 与 torch 两种文件里各一条的张量目录项（`gguf::Tensor` / `torch::Tensor`，同名不同物、靠路径区分），都只吐「名字 + 类型 + 形状 + 字节区间」、不带任何容器判据；torch `.bin` 的读出结果收进 `torch::Checkpoint`（与所有权表里的 `train::Checkpoint` 同名不同物，靠路径区分），`Bin` 随 torch 解析重写为只读 `Checkpoint` 后注销"

[[ownership.unlisted]]
crate = "storage"
names = ["Uint"]
reason = "随原 wire 字节码闭集并入 storage：CRC-32 / LEB128 / Sink 接收器 / 对齐落位 / `Invalid` 构造点。`Uint` 是 LEB 无符号整数标记族；公开面是 `crc`/`leb`/`sink` 这组函数与 trait，内部实现件待边界稳定后逐项进表。`leb::Cursor` 已作为读游标进入所有权表的 `Cursor` 行，不再留在基线里"

[gate]
# 静态质量门阈值（`tools` 分析器消费，`cargo test` 不可绕过）。
# 重复块不在此列：jscpd 管重复率硬门，cargo dupes 管语义近重复。
#
# 闭集：只有下面五个阈值键、`debt` 表与 `min_lines_baseline` 数组，多一个键就构建期报错（`gate::unknown_keys`）。
# 曾经还有 `simd_nloc = 96` 这条「SIMD 微核放宽」档位，但 Rust 侧没有任何 SIMD 微核
# （向量代码全在 `prim` 的 C 片段里，由 `cc` 编译、不经本门禁），于是它从未被读到过——
# 一条从不生效的档位比没有更糟，因为它让人以为有人管着。真出现 Rust 侧微核时按「度量 + 档位」
# 两级表重开，而不是先放一个空数字在这里。
ccn_max = 5          # 圈复杂度上限：ccn = 1 + 条件计数
nloc_max = 60         # 函数体有效行数上限
file_max_lines = 899  # 单文件行数硬上限：超过即按主题拆模块。899 是生产面上限，给一条完整算子族/格式表留足篇幅。
file_min_lines = 230  # 单文件行数下限：除薄入口（`lib.rs`/`main.rs`/`mod.rs`）与 libFuzzer 垫片
                      # （`fuzz/src/fuzz_*.rs`，判据在 `drivers.rs`）外，生产文件不足 230 行不允许单独
                      # 开文件——独立语义应收拢进所属模块，而不是铺成一函数一文件的口袋碎块。
test_max_lines = 800  # 测试代码行数上限：`tests/` 与 `#[path]` 挂进 src 的测试模块同受此限。
                      # 与 file_max_lines 分开：测试面放宽到 800 是因为一条真机用例的装配
                      # （设备/缓冲/派发/对拍）本身就要 30–50 行，切碎到看不出在测什么。测试代码不套下限。

# 行数下限存量基线（棘轮）：下列既存正交职责模块暂不受 file_min_lines 约束。
# 规则：新开口子必须达到下限或归入既有模块，不得在此清单外新增碎文件；清单条目一旦
# 收拢达标（≥ file_min_lines）就必须从这里删除，基线只准缩短、不准扩列。
min_lines_baseline = [
