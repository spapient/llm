# 词汇表契约的门禁配置（`docs/ARCHITECTURE.md` 第三节「闭集与位集」）。
#
# 消费方：`crates/tool/build.rs` 在**构建期**用 `toml` 把本文件展开成 `Table` 字面量，运行期由
# `tool::vocabulary()` 读取（ADR 0022）；`tests/contracts.rs`、`tests/architecture.rs` 与
# `crates/tool` 的门禁共用这棵树，不再各自解析文本。
#
# dylint 规则（HIR 版，`ui-toml` 配置指向本文件）是**计划中的**下一个消费方，用于在 IDE 里即时
# 提示同一条契约；它尚未落地，所以本文件的任何改动都以 `cargo test --test contracts` 为准，
# 不要假设有另一处也在读它。
#
# 白名单按 crate 列，并强制带理由：一份没有理由的豁免等于把规则删掉一半。

[closed]
# 允许手写闭集表（`pub const ALL: [Self; N]`）的 crate。
#
# 规则：`prof` 下游的成员必须用 `impl Closed for ..` 把名字表写成切片，`ALL`/`as_str`/`parse`
# 由 `prof::inherent_names!` 统一转发；只有**够不到 `Closed`** 的层（`llm-prof` 是 L2 基座，
# 反向依赖会在层内成环）才允许把词汇表留在本地。

[[closed.exempt]]
crate = "diagnostic"
reason = "L1：错误类别是错误类型的词汇表，反向依赖 L2 的 prof 会成环"

[[closed.exempt]]
crate = "shard"
reason = "L1：分片种类（张量流水线/数据）是调度层的词汇表"

[[closed.exempt]]
crate = "serve"
reason = "L6：帧类型是线格式的词汇表（`protocol` 模块，`proto` 为兼容重导出路径），与设备能力无关；`serve` 在 `prof` 下游，反向依赖会成环"


[bitset]
exempt = []

# 手写位集（`struct FooSet(u32)`）的允许清单。
#
# 规则：位集只有 `prof::atom::Set<E, WORDS>` 一份实现（`WORDS` 是 const 参数，容量在编译期
# 自证）。本清单为空是有意的——空清单本身是判据，不是"还没填"。

# 注解文法的闭集（`crates/annotation/src/syntax.rs` 的 `DTYPES`）没有豁免节：
#
# 规则：注解里的名字必须是词汇表的**投影**——`DTYPES` 与「`cutile::reference::tolerance`
# 给出非零阈值」的 `DType` 集合逐项相等，且用变体名核对 `codegen` 的机械映射。这是等式，
# 不是"尽量"：少一个名字就有一种输出永远无法被声明，多一个就拼出匹配不上的代码。
#
# 语义表与注册表的镜像（`#[model]` 标了必须注册、注册的 `model:` 必须是 `..::MODEL`）同样没有
# 豁免节：两条规则互为反面，出现例外说明契约该改，而不是某个 crate 该豁免。
# 门禁：`tests/contracts.rs::{annotation_names_come_from_the_vocabulary,
# the_registry_and_the_model_annotations_are_mirrors}`，以及 `#[model]` 在每个
# 调用点生成的 `DType::parse(..)` / `output_type()` 断言。

[ownership]
# 反向所有权校验的存量基线（`tests/architecture.rs::every_public_type_is_listed_or_baselined`）。
#
# 规则：每个成员 `crates/<member>/src` 里的 `pub struct|enum|trait` 必须出现在
# `docs/ARCHITECTURE.md` 第三节的所有权表，或登记在这里。
#
# 与 `[closed]` 白名单、`[[gate.debt]]` 同一套路：**存量冻结，新增必进表**。基线不允许过期——
# 某个名字后来进了表，或不再是 `pub`（删掉/改成私有），对应条目必须删除，否则测试失败。
# 每条都必须带理由：一份没有理由的豁免等于把规则删掉一半。
#
[[ownership.unlisted]]
crate = "cli"
names = ["CutileCommand"]
reason = "命令文法内部类型；`cli` 的公开面是 `Invocation`/`Command`，文法稳定后再进表"

[[ownership.unlisted]]
crate = "cutile"
names = ["CallArg", "ChainStep", "FragmentGap", "LanguageGate", "Lock", "NeedReport", "PrimCall", "Scope", "SpaceUse", "TensorGeometry", "Timing", "Unlock"]
reason = "内核 DSL 的协商、执行前端（含张量核几何 `TensorGeometry`）与结果类型；按 `crates/cutile/README.md` 的分节归类，待分节稳定后逐节进表"

[[ownership.unlisted]]
crate = "dtype"
names = ["BlockFormat", "Class", "DTypeSpec", "ElementSpec", "Family", "MxTypeSpec", "QTypeSpec", "UnknownCode", "UnknownName"]
reason = "行表类型、分类闭集与解析错误；表形状仍在演进，按闭集整体进表比逐项更清楚"

[[ownership.unlisted]]
crate = "engine"
names = ["LocalExecutor", "Queued", "SequenceOutcome"]
reason = "`LocalExecutor` 是只记账的同步 CPU 队列（`Executor` 基座本身已进对外所有权表）、`Queued` 是队列条目、`SequenceOutcome` 是批内逐条结果视图，同属内部实现，不进对外所有权表"

[[ownership.unlisted]]
crate = "fuzz"
names = ["Behaviour", "Repro", "Seed", "Target"]
reason = "模糊测试的目标、种子、行为描述与复现样本；工具成员，不参与运行时分层"

[[ownership.unlisted]]
crate = "op"
names = ["Access", "Arg", "Axis", "AxisRole", "AxisSpec", "Binary", "Chunk", "ConvGeom", "CType", "DecodeAttention", "DecodeFlashAttention", "Dense", "DequantI8", "Embed", "FlashAttention", "Formula", "Gemm", "Grid", "Gru", "Lstm", "Matmul", "MatmulI8Op", "Packed", "PackedRow", "Param", "Plain", "PlainFmt", "QuantI4", "Rnn", "Sampler", "ShapeContext", "Skeleton", "SplitMix64", "SymI8", "TileCombo", "Unary", "Values", "Variant"]
reason = "算子声明、语义与经典层采样辅助的内部类型（每个算子一个模块、一张行表）；公开面是 `REGISTRY`。经典 CNN 算子与 `nn` 同名层共享名字（`Conv1d`/`Conv2d`/`BatchNorm2d` 等）——所有权门按名字全局判重，故这些名字由 `nn` 的所有权行覆盖，`op` 侧不重复登记（与 `tool::Geometry`/`train::Geometry` 同一处置）。消歧义命名是 X2 的 P2 待办"

[[ownership.unlisted]]
crate = "prim"
names = ["Builtin"]
reason = "内嵌片段的条目类型；片段文本表才是对外契约"

[[ownership.unlisted]]
crate = "prof"
names = ["Attr", "AttrKey", "Constant", "Detected", "Emit", "Grade", "MatchRule", "Mem", "Meta", "Mismatch", "Need", "Prim", "ProfileError", "Provide", "Simt", "Space", "Span", "Unit", "Witness"]
reason = "档案行表的列类型与匹配规则；档案的公开面是 `Archive`/`Profile`"

[[ownership.unlisted]]
crate = "storage"
names = ["Mmap"]
reason = "内存映射视图；唯一 unsafe 岛，公开面等第一个真实消费者出现后再定"

[[ownership.unlisted]]
crate = "train"
names = ["DeferredOffload", "Running", "Ties", "WeightOffload"]
reason = "`Running` 是 BatchNorm 滚动统计值类型（每通道均值/方差），随 `Geometry::Norm` 前向读写搬运；`Ties` 是快照内的权重绑定表（`(源槽, 回填槽)` 下标对），只随快照写读搬运；`WeightOffload`/`DeferredOffload` 是参数换入换出的暂缓接缝与占位实现（通路未落地，闭环不调用）。公开训练面是 `Session`/`TrainConfig`"

[[ownership.unlisted]]
crate = "tool"
names = ["Call", "Direction", "Link", "Over"]
reason = "复杂度与回归门禁的行类型；工具成员，公开面是 `Report`"

[[ownership.unlisted]]
crate = "weights"
names = ["Axis", "Bin", "Gguf", "Pick", "Sha256", "Svd"]
reason = "格式适配器与选码内部件：bin/gguf 解析件、五轴选码的候选与结果（`axes` 的 `Axis`/`Pick`）、`svd` 分解件与哈希内部件；谱隙证书的 `Certified`/`Note`/`Stable`/`Mode`/`EpsMethod`/`Bound` 已进所有权表（它们决定秩，是可读的判定口径而不是实现细节），公开生产面是表里的读写契约与容器类型"

[[ownership.unlisted]]
crate = "wire"
names = ["Count", "FileSink", "Measured", "Sink", "SliceSink", "Uint"]
reason = "字节码闭集的接收器与无符号整数标记族；公开面是 CRC/LEB/Sink 这组函数与 trait，内部实现件待边界稳定后逐项进表。`leb::Cursor` 已作为读游标进入所有权表的 `Cursor` 行，不再留在基线里"

[gate]
# 静态质量门阈值（`tool` 分析器消费，`cargo test` 不可绕过）。
# 重复块不在此列：jscpd 管重复率硬门，cargo dupes 管语义近重复。
#
# 闭集：只有下面三个阈值键与 `debt` 表，多一个键就构建期报错（`gate::unknown_keys`）。
# 曾经还有 `simd_nloc = 96` 这条「SIMD 微核放宽」档位，但 Rust 侧没有任何 SIMD 微核
# （向量代码全在 `prim` 的 C 片段里，由 `cc` 编译、不经本门禁），于是它从未被读到过——
# 一条从不生效的档位比没有更糟，因为它让人以为有人管着。真出现 Rust 侧微核时按「度量 + 档位」
# 两级表重开，而不是先放一个空数字在这里。
ccn_max = 5          # 圈复杂度上限：ccn = 1 + 条件计数
nloc_max = 60        # 函数体有效行数上限
file_max_lines = 1200 # 单文件行数硬上限（合并 einsum/gemv 后高内聚单文件放宽）

# `[[gate.debt]]` 存量棘轮：只登记入口编排层既有超标（cli 的编排文件与 cutile 二进制入口）。
# 登记表是实测快照：登记值必须等于实测值，改善后必须删掉对应度量条目（`Gate::stale`），
# 恶化必失败。当前存量债务为零；入口排版/编排逻辑后续下沉 `tool` 后若再超标，按此表登记。
# 运行时生产代码（`crates/*/src` 除 cli 入口外）没有债务条目：超限即新增，直接失败。
