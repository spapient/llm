[gate]
# 静态质量门阈值（`tools` 分析器消费，`cargo test` 不可绕过）。
# 重复块不在此列：jscpd 管重复率硬门，cargo dupes 管语义近重复。
#
# 闭集：只有下面三个阈值键与 `debt` 表，多一个键就构建期报错（`gate::unknown_keys`）。
# 曾经还有 `simd_nloc = 96` 这条「SIMD 微核放宽」档位，但 Rust 侧没有任何 SIMD 微核
# （向量代码全在 `prim` 的 C 片段里，由 `cc` 编译、不经本门禁），于是它从未被读到过——
# 一条从不生效的档位比没有更糟，因为它让人以为有人管着。真出现 Rust 侧微核时按「度量 + 档位」
# 两级表重开，而不是先放一个空数字在这里。
ccn_max = 5          # 圈复杂度上限：ccn = 1 + 条件计数
nloc_max = 60        # 函数体有效行数上限
file_max_lines = 600 # 单文件行数硬上限：N3 的原始线。曾有 899 → 1200 的放宽，现已无文件超标，收紧回 600
test_max_lines = 800 # 测试代码行数上限：`tests/` 与 `#[path]` 挂进 src 的测试模块同受此限。
                     # 与 file_max_lines 分开：生产面 600 是 N3 的原始线，测试面放宽到 800 是因为
                     # 一条真机用例的装配（设备/缓冲/派发/对拍）本身就要 30–50 行，600 会逼人把
                     # 用例切碎到看不出在测什么。当前最大 cli/tests/device.rs 767，故这是收紧而非放宽。

# `[[gate.debt]]` 存量棘轮：只登记入口编排层既有超标（cli 的编排文件与 cutile 二进制入口）。
# 登记表是实测快照：登记值必须等于实测值，改善后必须删掉对应度量条目（`Gate::stale`），
# 恶化必失败。运行时生产代码（`crates/*/src` 除 cli 入口外）没有债务条目：超限即新增，直接失败。
#
# 现行唯一一条：`cutile` 子命令的派发。`run` 是 `CutileCommand` 六个变体的一一对应展开——一个六元的
# 平坦枚举，复杂度就是"派发表有几行"，压到 5 以内只能再拆一次 `match`（把一张表劈成两张），
# 那不是简化。等派发表下沉 `tools` 后按表驱动重写，届时删掉这条。

[[gate.debt]]
key = "crates/cli/src/cutile.rs:run#0"
ccn = 6
