# cargo-nextest 仓库配置（https://nexte.st/book/registry-config.html）。
#
# 十五个 fuzz harness（crates/fuzz/src/fuzz_*.rs，入口只有一行，判据在 `src/drivers.rs`）是
# libFuzzer 运行时，`gen_corpus` 是语料生成器：都是 `harness = false`，不走 libtest。nextest
# 若把它们当普通测试二进制去 `--list --format terse` 会失败。它们由 CI 的 fuzz job 单独构建、
# 调用；这里按二进制名排除。
# 默认 features 下 harness 被 `required-features = ["engine"]` 关掉，过滤器为空匹配、不影响计数。
#
# nextest 的 `default-filter` 不跨 profile 继承，下面两个 profile 各自复述同一份名单。
# 名单真值：gen_corpus, fuzz_cli, fuzz_http_head, fuzz_weights_json, fuzz_weights_safetensors,
# fuzz_weights_archive, fuzz_train_snapshot, fuzz_serve_frames, fuzz_wire_sealed, fuzz_wire_leb,
# fuzz_lex, fuzz_crc, fuzz_leb_roundtrip, fuzz_shape, fuzz_cutile_negotiate, fuzz_dist。

# 反重试立场（两个 profile 共同遵守）：flaky 测试要修根因，不靠重试刷绿——重试会把确定性
# 失败藏进偶发通过。因此 `retries` 一律保持 0，不在 CI 开重试；偶发失败由 JUnit 记录、回查。
# 单条失败也不中止其余测试：并行隔离下全量结果一次看全，避免后半程问题被首条失败掩盖。

# 本地开发口径：慢测试只报告不终止，其余与 CI 同立场。
[profile.default]
# 失败不重试（见上方反重试立场）。
retries = 0
# 单条失败不中止其余测试，全量结果一次看全。
fail-fast = false
# 超过 60s 仍未结束的测试标注为慢测试（只报告，不终止：关键路径会起子进程编 C/Metal）。
slow-timeout = "60s"
# 排除非 libtest 的 libfuzzer harness，其余 lib/集成/二进制测试照常并行运行。
default-filter = '''!binary(gen_corpus) & !binary(fuzz_cli) & !binary(fuzz_http_head) & !binary(fuzz_weights_json) & !binary(fuzz_weights_safetensors) & !binary(fuzz_weights_archive) & !binary(fuzz_train_snapshot) & !binary(fuzz_serve_frames) & !binary(fuzz_wire_sealed) & !binary(fuzz_wire_leb) & !binary(fuzz_lex) & !binary(fuzz_crc) & !binary(fuzz_leb_roundtrip) & !binary(fuzz_shape) & !binary(fuzz_cutile_negotiate) & !binary(fuzz_dist)'''

# CI 口径：立场与本地一致（不重试、不全量中止），额外补 JUnit 留痕、超时终止与分类超时宽限。
[profile.ci]
# 失败不重试（见上方反重试立场）。
retries = 0
# 单条失败不中止其余测试。
fail-fast = false
# 慢测试连续两次超时才终止，避免单次机器抖动误杀；周期仍取 60s。本地 default 口径只报告不终止。
slow-timeout = { period = "60s", terminate-after = 2 }
# 排除非 libtest 的 libfuzzer harness（与 default 同一名单）。
default-filter = '''!binary(gen_corpus) & !binary(fuzz_cli) & !binary(fuzz_http_head) & !binary(fuzz_weights_json) & !binary(fuzz_weights_safetensors) & !binary(fuzz_weights_archive) & !binary(fuzz_train_snapshot) & !binary(fuzz_serve_frames) & !binary(fuzz_wire_sealed) & !binary(fuzz_wire_leb) & !binary(fuzz_lex) & !binary(fuzz_crc) & !binary(fuzz_leb_roundtrip) & !binary(fuzz_shape) & !binary(fuzz_cutile_negotiate) & !binary(fuzz_dist)'''

# JUnit/XUnit XML 报告：供 CI 面板与归档消费；失败/重试用例的 stdout/stderr 随用例记录。
[profile.ci.junit]
path = "target/nextest/ci/junit.xml"

# 分类超时 override：设备探针 / 子进程编译类用例（起 cc/clang/xcrun、编 Metal/PTX）
# 给 180s 周期、连续两次超时才终止，其余用例走上面的 60s 口径。
[[profile.ci.overrides]]
filter = 'test(/metal|cuda|nvcc|probe|witness|compile|backend/)'
slow-timeout = { period = "180s", terminate-after = 2 }
