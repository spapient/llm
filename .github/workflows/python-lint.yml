name: Python and source metrics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx ruff check validation
      - run: uvx ruff format --check validation

  cloc:
    name: cloc source metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cloc 2.12 with checksum verification
        run: |
          mkdir -p "$RUNNER_TEMP/bin" target/cloc
          curl --fail --location --silent --show-error \
            https://github.com/AlDanial/cloc/releases/download/v2.12/cloc-2.12.pl \
            --output "$RUNNER_TEMP/bin/cloc"
          echo "621592d34f835ef178115a1643f15ebc8e73ec1d47b5484c46376fc15b78f03e  $RUNNER_TEMP/bin/cloc" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/cloc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Record version and generate report
        run: |
          cloc --version
          cloc --config .config/cloc/options.txt crates validation scripts
      - name: Enforce the 60000-line Rust source budget
        run: bash scripts/loc-budget.sh
      - name: Upload source metrics
        uses: actions/upload-artifact@v4
        with:
          name: cloc-report
          path: target/cloc/report.csv
          retention-days: 14
