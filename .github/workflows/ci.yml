name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt 的排版随版本漂移：本仓库的格式基线由 nightly 的 rustfmt 定，用 stable 1.100.0 的 rustfmt
  # 反而会把部分文件"展开"（实测 `device/tests/metal/correctness.rs` 800→807 行顶破 FILE_MAX，
  # `fast/i8.rs` 的多行条件把 Ccn 抬到 7），是门禁变红而不是更整齐。故格式门固定在 nightly，
  # 与构建用的 stable 解耦——`rust-toolchain.toml` 换 stable 不影响这一条。
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (nextest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # lib / 集成 / 二进制测试由 nextest 按测试二进制并行隔离运行。libfuzzer harness
      # 不是 libtest 运行器，已在 `.config/nextest.toml` 按二进制名排除，交独立 fuzz job。
      # doc-test 不在 nextest 范围，由 `doc` job 的 `cargo test --doc` 负责。
      # `--profile ci`：全量跑完不中止、JUnit XML 留痕、设备/探针类用例走放宽超时（配置见
      # `.config/nextest.toml`；反重试立场保持不变，flaky 修根因而不靠重试刷绿）。
      # LLM_TEST_SKIP_DIR 让 testkit 把"前提不满足而跳过"的用例落到结构化日志，供下一步汇总，
      # 避免静默空转在绿测里不可见。
      - name: Test
        env:
          LLM_TEST_SKIP_DIR: ${{ github.workspace }}/target/skips
        run: cargo nextest run --profile ci --workspace --all-features --locked

      # 跳过不是失败：这里只汇总条数与原因，不按跳过数阻断。
      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          if [ -f target/skips/skips.log ]; then
            count=$(wc -l < target/skips/skips.log)
            echo "::group::Skipped tests ($count)"
            sort target/skips/skips.log | uniq -c
            echo "::endgroup::"
          else
            echo "No skipped-test records."
          fi

      # JUnit XML 留痕：失败/重试用例与输出随报告归档，供面板与事后回查。
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  metal-macos:
    name: Metal ABI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      # 两条口径都要：lib 里的 executor Metal 单测 + `metal_suite` 集成目标
      # （correctness/gemm/attention/contract/tensor）。只跑 `--lib metal` 会漏掉后者。
      - run: cargo test -p llm-device --lib --locked metal
      - run: cargo test -p llm-device --test metal_suite --locked

  address-sanitizer-macos:
    name: address sanitizer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="-Zsanitizer=address" cargo test -p llm-device --lib --locked

  msrv:
    name: msrv (1.100.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: |
          # MSRV 就是 README 承诺的 1.100.0：stable 通道，不再是 nightly
          rm -f rust-toolchain.toml
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@v2
      # libtest 会收集 `[[test]]` 目标：三个 libfuzzer harness 是 `harness = false`、`no_main`，
      # 被 libtest 直接运行会进入模糊循环。它们归独立 fuzz job 构建与有界运行；这里排除整个
      # llm-fuzz crate，其确定性 sweep 用例由 test job 的 nextest（按二进制名过滤）覆盖。
      - run: cargo test --workspace --all-features --locked --exclude llm-fuzz

  # nightly 通道的守卫：nn `gemv::simd` 的手写车道与 prof `native::sme` 的 ZA 外积都只在
  # `cfg(nightly)` 下编译，而默认工具链已是 stable——没有这条 job，那两条通道会静默腐坏而无人察觉。
  # 跑在 macOS（aarch64）上才能真正编到 SME；`gemv::simd` 是架构无关的，两者一并覆盖。
  nightly:
    name: nightly channel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p llm-nn -p llm-prof --lib --all-features --locked

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
      # doc-test 不由 nextest 执行：这里单独跑，文档块里的示例也必须编得过、断言成立。
      - run: cargo test --doc --workspace --all-features --locked

  dup:
    name: duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 硬门：阈值 0（零容忍，与 .config/.jscpd.json 单一来源一致）——出现任何 clone 即失败。
      - name: jscpd hard gate
        run: npx --yes jscpd
      # 语义巡检：AST 归一化暴露近重复，只出报告不阻断（硬门已由 jscpd 负责）。
      - name: cargo-dupes semantic patrol
        run: |
          cargo install --git https://github.com/mpecan/cargo-dupes cargo-dupes --locked
          cargo dupes --exclude-tests report

  gates:
    name: S++ gates (static + architecture + name + density)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      # 静态门：源文件圈复杂度 / 行数 / 命名 / unsafe 计数 / Call 门等硬阈值。
      # ratchet：新增身份必进表、已登记值恶化必失败，与 `.config/lints/vocabulary.toml` 单一来源一致。
      - name: Static gate
        run: cargo test -p llm-tools --test gate --locked
      # 架构门：层表 / 边集 / 所有权 / 词汇表镜像 / 越界岛 / 对拍口径，
      # 与 docs/ARCHITECTURE.md 逐条比对（单一来源）。门禁是 testkit 的单测，
      # 跑 `--lib` 就覆盖全部主题（分工见 `crates/testkit/src/lib.rs` 的模块表）。
      - name: Architecture gate
        run: cargo test -p llm-testkit --lib --locked
      # 命名门：下划线文件名 / 后缀残留 / 泛名函数 / Op 后缀，零命中（已清零，保持阻断）。
      - name: Name lint
        run: bash scripts/name-lint.sh
      # 密度预算：crates/*/src ≤90,000 行。R1–R2 报告不阻断，R3 起转阻断（阈值只收紧）。
      # 不阻断是为了给净减留出窗口；报告输出仍可见，避免静默漂移。
      - name: Density budget (report)
        continue-on-error: true
        run: bash scripts/loc-budget.sh

  deny:
    name: deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      # 漏洞/许可证/来源/重复依赖硬门，配置见 deny.toml。
      - run: cargo deny check
      # 依赖卫生：找未使用的依赖。
      - run: cargo machete

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # 覆盖率采集与主测试运行器一致走 nextest（lib/集成/二进制测试并行隔离执行）。
      # 口径说明：doctest 不由 nextest 执行，`cargo llvm-cov --doc` 采集文档示例覆盖目前仍是
      # 不稳定特性（需 nightly，见 cargo-llvm-cov issue #2）；本仓文档示例的**正确性**由独立
      # `doc` job 的 `cargo test --doc -D warnings` 断言，覆盖率数字以 lib/集成测试为准，不把
      # 不稳定的 doctest 覆盖并进硬门口径。
      - name: Generate lcov
        run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      # 整体覆盖率摘要：打印到 job 日志留痕，便于观察回退趋势；硬下限仍由下面分 crate floor 把守。
      - name: Coverage summary
        run: cargo llvm-cov report --text
      # 硬门：cutile 行/函数覆盖率低于下限即失败。下限低于本地干净基线（行 82.9% / 函数 83.2%），
      # 给 ubuntu 上不可用的 Metal/NVCC 探测分支留出平台差异余量，只防整体回退、不卡单次波动。
      - name: Coverage floor (cutile)
        run: cargo llvm-cov nextest -p cutile --all-features --locked --fail-under-lines 75 --fail-under-functions 70
      # 其余核心基座按同一口径加保守下限：本地干净基线 wire 行 75.0% / 函数 71.8%，
      # dtype 行 96.4% / 函数 97.3%，weights 行 78.3% / 函数 71.9%（torch legacy 路径样本
      # 门控跳过，bin.rs 覆盖偏低）。下限留平台与样本差异余量，只防整体回退。
      - name: Coverage floor (wire)
        run: cargo llvm-cov nextest -p llm-wire --all-features --locked --fail-under-lines 68 --fail-under-functions 64
      - name: Coverage floor (dtype)
        run: cargo llvm-cov nextest -p llm-dtype --all-features --locked --fail-under-lines 88 --fail-under-functions 88
      - name: Coverage floor (weights)
        run: cargo llvm-cov nextest -p llm-weights --all-features --locked --fail-under-lines 70 --fail-under-functions 64
      # 门禁 crate：纯 Rust 无平台探测分支。本地干净基线行 94.5% / 函数 94.9%，下限留单次样本波动余量，
      # 只防整体回退；every_source 全仓门的红绿由存量债负责，不在本覆盖率门口径内。
      - name: Coverage floor (tools)
        run: cargo llvm-cov nextest -p llm-tools --all-features --locked --fail-under-lines 88 --fail-under-functions 85
      # 六大核心 crate 补门（此前只有上面 5 个 crate 有硬门，最大的 nn/train/prof/device/shard/serve
      # 回退不可见）。本地干净基线（macOS arm64，all-features）：nn 行 84.4% / 函数 85.6%，
      # train 86.4% / 88.5%，prof 69.2% / 73.0%，device 58.3% / 65.6%，shard 57.0% / 61.0%，
      # serve 85.0% / 87.9%。下限统一留 8–10 点平台余量（ubuntu x86_64 走 AVX2 车道而非 NEON，
      # prof 的探测分支同理）；device 的 Metal 执行器路径在 ubuntu 不可用，余量放宽到 15 点。
      # 与既有 floor 同一立场：只防整体回退、不卡单次波动，基线抬升后阈值只收紧。
      - name: Coverage floor (nn)
        run: cargo llvm-cov nextest -p llm-nn --all-features --locked --fail-under-lines 75 --fail-under-functions 76
      - name: Coverage floor (train)
        run: cargo llvm-cov nextest -p llm-train --all-features --locked --fail-under-lines 78 --fail-under-functions 80
      - name: Coverage floor (prof)
        run: cargo llvm-cov nextest -p llm-prof --all-features --locked --fail-under-lines 60 --fail-under-functions 63
      - name: Coverage floor (device)
        run: cargo llvm-cov nextest -p llm-device --all-features --locked --fail-under-lines 43 --fail-under-functions 50
      - name: Coverage floor (shard)
        run: cargo llvm-cov nextest -p llm-shard --all-features --locked --fail-under-lines 48 --fail-under-functions 52
      - name: Coverage floor (serve)
        run: cargo llvm-cov nextest -p llm-serve --all-features --locked --fail-under-lines 77 --fail-under-functions 79
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  bench:
    name: bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      # CI 只保证基准代码始终可编译；实测与基线判定在固定硬件上跑（跨机器绝对值不可比）。
      - name: Build benchmarks
        run: cargo bench --workspace --all-features --locked --no-run
      # 回退判定本身也要被编译与执行一次：没有本机基线/没有测量时它登记跳过（`llm-testkit[skip]`），
      # 有基线的固定靶机上才会真的判 pass/regressed。判定规则只有 `tools::regress` 一份。
      - name: Judge the gemv_f32 baseline
        run: cargo test -p llm-benchmarks --test regress --locked -- --nocapture
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: target/bench-report/
          retention-days: 14
          if-no-files-found: ignore

  fuzz:
    name: fuzz (libfuzzer)
    runs-on: ubuntu-latest
    env:
      # 目标清单只由 scripts/fuzz.sh 持有；CI 这里只覆盖运行预算。
      FUZZ_SECONDS: "30"
      FUZZ_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
      - uses: Swatinem/rust-cache@v2
      # 本地与 CI 共用 scripts/fuzz.sh：覆盖插桩、ASan、种子生成、超时和内存预算只有一份。
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - name: Build and run fuzz targets (bounded)
        run: bash scripts/fuzz.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz-artifacts/
          retention-days: 14
