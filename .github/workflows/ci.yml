name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (nextest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # lib / 集成 / 二进制测试由 nextest 按测试二进制并行隔离运行。libfuzzer harness
      # 不是 libtest 运行器，已在 `.config/nextest.toml` 按二进制名排除，交独立 fuzz job。
      # doc-test 不在 nextest 范围，由 `doc` job 的 `cargo test --doc` 负责。
      # LLM_TEST_SKIP_DIR 让 testkit 把"前提不满足而跳过"的用例落到结构化日志，供下一步汇总，
      # 避免静默空转在绿测里不可见。
      - name: Test
        env:
          LLM_TEST_SKIP_DIR: ${{ github.workspace }}/target/skips
        run: cargo nextest run --workspace --all-features --locked

      # 跳过不是失败：这里只汇总条数与原因，不按跳过数阻断。
      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          if [ -f target/skips/skips.log ]; then
            count=$(wc -l < target/skips/skips.log)
            echo "::group::Skipped tests ($count)"
            sort target/skips/skips.log | uniq -c
            echo "::endgroup::"
          else
            echo "No skipped-test records."
          fi

  metal-macos:
    name: Metal ABI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p llm-engine --lib --locked metal

  address-sanitizer-macos:
    name: address sanitizer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="-Zsanitizer=address" cargo test -p llm-engine --lib --locked

  msrv:
    name: msrv (1.100.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: |
          # 1.100 正式版发布前，MSRV 以 nightly-2026-09-01（rustc 1.100.0-nightly）为准
          rm -f rust-toolchain.toml
          rustup toolchain install nightly-2026-09-01 --profile minimal --no-self-update
          rustup default nightly-2026-09-01
      - uses: Swatinem/rust-cache@v2
      # libtest 会收集 `[[test]]` 目标：三个 libfuzzer harness 是 `harness = false`、`no_main`，
      # 被 libtest 直接运行会进入模糊循环。它们归独立 fuzz job 构建与有界运行；这里排除整个
      # llm-fuzz crate，其确定性 sweep 用例由 test job 的 nextest（按二进制名过滤）覆盖。
      - run: cargo test --workspace --all-features --locked --exclude llm-fuzz

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
      # doc-test 不由 nextest 执行：这里单独跑，文档块里的示例也必须编得过、断言成立。
      - run: cargo test --doc --workspace --all-features --locked

  dup:
    name: duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 硬门：阈值 0（零容忍，与 .config/.jscpd.json 单一来源一致）——出现任何 clone 即失败。
      - name: jscpd hard gate
        run: npx --yes jscpd
      # 语义巡检：AST 归一化暴露近重复，只出报告不阻断（硬门已由 jscpd 负责）。
      - name: cargo-dupes semantic patrol
        run: |
          cargo install --git https://github.com/mpecan/cargo-dupes cargo-dupes --locked
          cargo dupes --exclude-tests report

  gates:
    name: S++ gates (static + architecture + name + density)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      # 静态门：源文件圈复杂度 / 行数 / 命名 / unsafe 计数 / Call 门等硬阈值。
      # ratchet：新增身份必进表、已登记值恶化必失败，与 `.config/lints/vocabulary.toml` 单一来源一致。
      - name: Static gate
        run: cargo test -p llm-tools --test gate --locked
      # 架构门：层表 / 边集 / 所有权 / 入口不定义类型 / 错误边界不回落字符串，
      # 与 docs/ARCHITECTURE.md 边集逐条比对（单一来源）。
      - name: Architecture gate
        run: cargo test -p llm-testkit --test architecture --locked
      # 命名门：下划线文件名 / 后缀残留 / 泛名函数 / Op 后缀，零命中（已清零，保持阻断）。
      - name: Name lint
        run: bash scripts/name-lint.sh
      # 密度预算：crates/*/src ≤90,000 行。R1–R2 报告不阻断，R3 起转阻断（阈值只收紧）。
      # 不阻断是为了给净减留出窗口；报告输出仍可见，避免静默漂移。
      - name: Density budget (report)
        continue-on-error: true
        run: bash scripts/loc-budget.sh

  deny:
    name: deny + machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      # 漏洞/许可证/来源/重复依赖硬门，配置见 deny.toml。
      - run: cargo deny check
      # 依赖卫生：找未使用的依赖。
      - run: cargo machete

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # 覆盖率采集与主测试运行器一致走 nextest（lib/集成/二进制测试并行隔离执行）。
      - name: Generate lcov
        run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      # 硬门：cutile 行/函数覆盖率低于下限即失败。下限低于本地干净基线（行 82.9% / 函数 83.2%），
      # 给 ubuntu 上不可用的 Metal/NVCC 探测分支留出平台差异余量，只防整体回退、不卡单次波动。
      - name: Coverage floor (cutile)
        run: cargo llvm-cov nextest -p cutile --all-features --locked --fail-under-lines 75 --fail-under-functions 70
      # 其余核心基座按同一口径加保守下限：本地干净基线 wire 行 75.0% / 函数 71.8%，
      # dtype 行 96.4% / 函数 97.3%，weights 行 78.3% / 函数 71.9%（torch legacy 路径样本
      # 门控跳过，bin.rs 覆盖偏低）。下限留平台与样本差异余量，只防整体回退。
      - name: Coverage floor (wire)
        run: cargo llvm-cov nextest -p llm-wire --all-features --locked --fail-under-lines 68 --fail-under-functions 64
      - name: Coverage floor (dtype)
        run: cargo llvm-cov nextest -p llm-dtype --all-features --locked --fail-under-lines 88 --fail-under-functions 88
      - name: Coverage floor (weights)
        run: cargo llvm-cov nextest -p llm-weights --all-features --locked --fail-under-lines 70 --fail-under-functions 64
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  bench:
    name: bench (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      # CI 只保证基准代码始终可编译；实测与基线判定在固定硬件上跑（跨机器绝对值不可比）。
      - name: Build benchmarks
        run: cargo bench --workspace --all-features --locked --no-run
      # 回退判定本身也要被编译与执行一次：没有本机基线/没有测量时它登记跳过（`llm-testkit[skip]`），
      # 有基线的固定靶机上才会真的判 pass/regressed。判定规则只有 `tools::regress` 一份。
      - name: Judge the gemv_f32 baseline
        run: cargo test -p llm-benchmarks --test regress --locked -- --nocapture
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: target/bench-report/
          retention-days: 14
          if-no-files-found: ignore

  fuzz:
    name: fuzz (libfuzzer)
    runs-on: ubuntu-latest
    env:
      # 构建与有界运行共用这一份清单，避免两处列表漂移。
      FUZZ_TARGETS: >-
        fuzz_cli fuzz_weights_json fuzz_weights_safetensors fuzz_weights_archive
        fuzz_train_snapshot fuzz_serve_frames fuzz_wire_sealed fuzz_wire_leb
        fuzz_http_head fuzz_lex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-09-01"
      - uses: Swatinem/rust-cache@v2
      # libFuzzer 运行时与 ASan 由 clang 提供；Rust 侧只接 `libfuzzer-sys` 垫片。
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      # 覆盖引导 + 地址 sanitizer：按 libfuzzer-sys 手册传 sancov 覆盖标志与 `-Z sanitizer=address`。
      # harness 在 `engine` feature 后才编译，常规 test/clippy 不构建 libFuzzer 运行时。
      # `harness = false` 的测试二进制带哈希名、留在 build out 目录，运行前按目标名解析路径。
      - name: Build fuzz harnesses
        run: |
          for target in $FUZZ_TARGETS; do
            cargo rustc -p llm-fuzz --features engine --test "$target" --release --locked -- \
              -C passes='sancov-module' \
              -C llvm-args='-sanitizer-coverage-level=3' \
              -C llvm-args='-sanitizer-coverage-inline-8bit-counters' \
              -Z sanitizer=address
          done
      # 种子语料由库编码生成：先构造合法范例写到 corpus/<目标>/，覆盖引导从结构附近出发，
      # 而不是从纯噪声起步。生成器是普通 debug 二进制，不需要 sanitizer 与 libFuzzer 运行时。
      - name: Generate seed corpus
        run: |
          cargo test -p llm-fuzz --test gen_corpus --locked --no-run
          gen="$(find target/debug/build/llm-fuzz -type f -name 'gen_corpus'-* ! -name '*.d' ! -name '*.o' | head -1)"
          "$gen" crates/fuzz/corpus
      # 有界运行：每个目标 30 秒；挂种子语料与关键字字典；崩溃/ASan 报错以非零退出，
      # libFuzzer 把复现输入留在 artifact 目录。单条输入超时 10 秒判挂死，内存上限 2 GiB，
      # 避免一个死循环或失控分配拖垮整个 job。
      - name: Run fuzz targets (bounded)
        run: |
          mkdir -p fuzz-artifacts
          for target in $FUZZ_TARGETS; do
            bin="$(find target/release/build/llm-fuzz -type f -name "$target"-* ! -name '*.d' ! -name '*.o' | head -1)"
            dict="crates/fuzz/corpus/dict/$target.dict"
            dict_args=""
            [ -f "$dict" ] && dict_args="-dict=$dict"
            "$bin" "crates/fuzz/corpus/$target" $dict_args \
              -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
              -print_final_stats=1 -artifact_prefix=./fuzz-artifacts/
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz-artifacts/
          retention-days: 14
